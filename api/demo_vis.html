<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真实空间数据多车协同派发中心</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --panel-bg: rgba(15, 23, 42, 0.9);
            --text-color: #f8fafc;
            --accent: #0ea5e9;
            --btn-bg: #2563eb;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.3) 0%, transparent 80%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .canvas-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        .panel {
            width: 440px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        h1 {
            font-size: 18px;
            margin: 0 0 4px 0;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            width: 100%;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .logs-container {
            height: 160px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .log-item {
            font-size: 12px;
            padding: 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid #64748b;
            line-height: 1.5;
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .vehicle-card {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        .vehicle-title {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .vehicle-load {
            font-size: 18px;
            font-weight: bold;
            color: #cbd5e1;
        }

        .eta-panel {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .status-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.4;
        }

        .vehicle-eta-section {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .vehicle-eta-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .tips {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 17, 32, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            gap: 20px;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #0ea5e9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #94a3b8;
            font-size: 14px;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        /* ── 速率控制区 ── */
        .speed-control {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .speed-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
        }

        .speed-badge {
            font-size: 15px;
            font-weight: 800;
            color: #0ea5e9;
            letter-spacing: -0.5px;
            min-width: 48px;
            text-align: right;
            transition: color 0.2s;
        }

        .speed-badge.fast { color: #f59e0b; }
        .speed-badge.turbo { color: #ef4444; }

        /* 对数尺进条 */
        .speed-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(to right, #0ea5e9 0%, #0ea5e9 var(--fill), rgba(255,255,255,0.1) var(--fill), rgba(255,255,255,0.1) 100%);
            outline: none;
            cursor: pointer;
        }

        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #0ea5e9;
            box-shadow: 0 0 8px rgba(14, 165, 233, 0.7);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .speed-slider::-webkit-slider-thumb:hover {
            transform: scale(1.25);
            box-shadow: 0 0 14px rgba(14, 165, 233, 0.9);
        }

        .speed-presets {
            display: flex;
            gap: 6px;
        }

        .speed-preset-btn {
            flex: 1;
            padding: 5px 0;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            background: rgba(255,255,255,0.05);
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.15s;
        }

        .speed-preset-btn:hover {
            background: rgba(14,165,233,0.15);
            border-color: #0ea5e9;
            color: #e2e8f0;
        }

        .speed-preset-btn.active {
            background: rgba(14,165,233,0.25);
            border-color: #0ea5e9;
            color: #0ea5e9;
        }
    </style>
</head>

<body>
    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">🌍 正在从 Python 后端拉取地图数据...</div>
    </div>

    <div class="container">
        <div class="canvas-area" id="canvasWrapper">
            <canvas id="simCanvas"></canvas>
            <div class="tips">🖱️ 支持鼠标滚轮缩放与拖拽平移路网（算法由 Python 后端驱动）</div>
        </div>

        <div class="panel">
            <div class="header">
                <h1>🌐 SHP高精路网三车指派中心</h1>
                <div style="font-size:12px; color:#94a3b8">✅ 真实速度30km/h | ✅ 坐标吸附系统 | ✅ Python后端算法</div>
            </div>

            <div class="status-grid" id="vPanel"></div>

            <button id="spawnBtn" onclick="spawnOrder()" class="btn">🚀 模拟野外发起：坐标随机盲叫</button>

            <!-- 动画速率控制 -->
            <div class="speed-control">
                <div class="speed-header">
                    <span>⚡ 动画速率倍数</span>
                    <span class="speed-badge" id="speedLabel">1.0×</span>
                </div>
                <input type="range" class="speed-slider" id="speedSlider"
                    min="0" max="100" value="33"
                    oninput="onSpeedSlider(this.value)"
                    style="--fill: 33%">
                <div class="speed-presets">
                    <button class="speed-preset-btn" onclick="setSpeed(0.25)">¼×</button>
                    <button class="speed-preset-btn" onclick="setSpeed(0.5)">½×</button>
                    <button class="speed-preset-btn active" onclick="setSpeed(1)">1×</button>
                    <button class="speed-preset-btn" onclick="setSpeed(2)">2×</button>
                    <button class="speed-preset-btn" onclick="setSpeed(5)">5×</button>
                    <button class="speed-preset-btn" onclick="setSpeed(10)">10×</button>
                    <button class="speed-preset-btn" onclick="setSpeed(50)">50×</button>
                    <button class="speed-preset-btn" onclick="setSpeed(100)">100×</button>
                </div>
            </div>

            <h3 style="font-size:13px; margin: 0; color:#cbd5e1; display:flex; justify-content:space-between;">
                <span>🎯 在线订单详细跟踪(ETA)</span>
            </h3>
            <div class="eta-panel" id="orderStatusPanel"></div>

            <h3 style="font-size:13px; margin: 0; color:#cbd5e1;">⚡ 调度审计系统日志</h3>
            <div class="logs-container" id="logPanel"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // 纯前端可视化层 —— 所有算法均由 Python 后端
        // (demo_backend.py) 实现，本文件仅负责：
        //   1. 从 /map_snapshot 获取静态地图数据并初始化 Canvas
        //   2. 每帧向 /tick 请求帧状态并渲染
        //   3. 按钮触发 /spawn_order
        // ============================================================

        // 自动探测后端地址。如果通过 http 访问则使用 origin；
        // 如果物理文件打开，则尝试本地默认端口。
        const BACKEND = (location.origin && location.origin !== 'null' && location.origin.startsWith('http'))
            ? location.origin
            : 'http://localhost:8765';
        console.log('📡 正在连接后端:', BACKEND);

        const logPanel = document.getElementById('logPanel');
        const orderStatusPanel = document.getElementById('orderStatusPanel');
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvasWrapper');
        const loadingOverlay = document.getElementById('loadingOverlay');

        // ── 全局状态 ──
        let MAP = null;
        let mapPath = null;
        let speedMultiplier = 1.0;
        let lastSysTime = 0.0;
        let lastResponseWallTime = null;
        let latestState = null;

        // ── 动画速率倍数 ──
        const LOG_MIN = Math.log10(0.1);
        const LOG_MAX = Math.log10(100);
        function sliderToSpeed(v) { return Math.pow(10, LOG_MIN + (v / 100) * (LOG_MAX - LOG_MIN)); }
        function speedToSlider(s) { return ((Math.log10(s) - LOG_MIN) / (LOG_MAX - LOG_MIN)) * 100; }

        function applySpeed(s) {
            speedMultiplier = Math.max(0.1, Math.min(100, s));
            const label = document.getElementById('speedLabel'), slider = document.getElementById('speedSlider');
            label.textContent = `${speedMultiplier < 1 ? speedMultiplier.toFixed(2) : speedMultiplier < 10 ? speedMultiplier.toFixed(1) : Math.round(speedMultiplier)}×`;
            label.className = 'speed-badge' + (speedMultiplier >= 5 ? ' turbo' : speedMultiplier >= 2 ? ' fast' : '');
            const sv = speedToSlider(speedMultiplier);
            slider.value = sv;
            slider.style.setProperty('--fill', `${sv}%`);
            document.querySelectorAll('.speed-preset-btn').forEach(btn => btn.classList.remove('active'));
            const presets = [0.25, 0.5, 1, 2, 5, 10, 50, 100];
            const idx = presets.findIndex(p => Math.abs(p - speedMultiplier) < 0.01);
            if (idx !== -1) document.querySelectorAll('.speed-preset-btn')[idx].classList.add('active');
        }
        window.onSpeedSlider = (v) => applySpeed(sliderToSpeed(parseFloat(v)));
        window.setSpeed = (s) => applySpeed(s);

        // ── Canvas 视角控制 ──
        let scale = 1.0, panX = 0, panY = 0;
        function resizeCanvas() {
            let dpr = window.devicePixelRatio || 1;
            canvas.width = wrapper.clientWidth * dpr; canvas.height = wrapper.clientHeight * dpr;
            let vw = 1000, vh = 800;
            scale = Math.min(canvas.width / vw, canvas.height / vh) * 0.9;
            panX = (canvas.width - vw * scale) / 2; panY = (canvas.height - vh * scale) / 2;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let isDragging = false, startDrag = { x: 0, y: 0 };
        canvas.addEventListener('mousedown', e => {
            isDragging = true;
            startDrag = { x: e.clientX * window.devicePixelRatio - panX, y: e.clientY * window.devicePixelRatio - panY };
        });
        canvas.addEventListener('mousemove', e => {
            if (isDragging) {
                panX = e.clientX * window.devicePixelRatio - startDrag.x;
                panY = e.clientY * window.devicePixelRatio - startDrag.y;
            }
        });
        ['mouseup','mouseleave'].forEach(evt => canvas.addEventListener(evt, () => isDragging = false));
        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            let dpr = window.devicePixelRatio, rect = canvas.getBoundingClientRect();
            let mouseX = (e.clientX - rect.left) * dpr, mouseY = (e.clientY - rect.top) * dpr;
            let zoom = Math.exp((e.deltaY < 0 ? 1 : -1) * 0.1);
            panX = mouseX - (mouseX - panX) * zoom; panY = mouseY - (mouseY - panY) * zoom; scale *= zoom;
        }, { passive: false });

        function addLog(msg, color = '#64748b', time = 0) {
            const el = document.createElement('div');
            el.className = 'log-item'; el.style.borderLeftColor = color;
            el.innerHTML = `<span style="font-size:10px; color:#94a3b8">系统时间 ${time.toFixed(1)}s</span><br/>${msg}`;
            logPanel.prepend(el);
            if (logPanel.children.length > 40) logPanel.removeChild(logPanel.lastChild);
        }

        async function fetchMapData() {
            try {
                const resp = await fetch(`${BACKEND}/map_snapshot`);
                if (!resp.ok) throw new Error("Backend not responding");
                MAP = await resp.json();
                mapPath = new Path2D();
                let edgeCount = 0;
                for (let e of MAP.edges) {
                    let u = MAP.nodes[e.u], v = MAP.nodes[e.v];
                    if (u && v) {
                        mapPath.moveTo(u.x, u.y); mapPath.lineTo(v.x, v.y);
                        edgeCount++;
                    }
                }
                console.log(`✅ 成功初始化 ${edgeCount} 条街道渲染路径 (Path2D)`);
                loadingOverlay.style.display = 'none';
                addLog('🌍 地图数据拉取完毕，GPU 路网渲染就绪，可视化引擎启动。', '#0ea5e9', 0);
            } catch (e) {
                console.error('fetchMapData error:', e);
                document.querySelector('.loading-text').innerHTML = `❌ 无法连接后端：${e.message}<br/><small>请确保 python demo_backend.py 已启动并正在运行。</small>`;
            }
        }

        /**
         * 核心平滑加速器：推演车辆在两次后端通信之间的视觉位置。
         */
        function getExtrapolatedPos(v, wallElapsed) {
            if (!v.pathQueue || v.pathQueue.length === 0) return [v.x, v.y];
            let remainingMeters = (MAP.speed_mps || 8.33) * wallElapsed * speedMultiplier;
            let curX = v.x, curY = v.y;
            for (let q of v.pathQueue) {
                let dx = q.node.x - curX, dy = q.node.y - curY;
                let d = Math.sqrt(dx * dx + dy * dy);
                if (d < 0.001) continue;
                let moveCanvas = d * (remainingMeters / 100.0); // 粗略线性推演像素位移
                if (d <= moveCanvas) {
                    remainingMeters -= (d / moveCanvas) * remainingMeters;
                    curX = q.node.x; curY = q.node.y;
                } else {
                    let ratio = moveCanvas / d;
                    return [curX + dx * ratio, curY + dy * ratio];
                }
                if (remainingMeters <= 0) break;
            }
            return [curX, curY];
        }

        function drawMap() {
            if (!MAP) return;
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.translate(panX, panY); ctx.scale(scale, scale);

            // 1. 路网
            ctx.lineWidth = Math.max(0.3, 1.0 / scale);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.stroke(mapPath);

            let ptRadius = Math.max(1.5, 3.0 / scale);
            let wallElapsed = lastResponseWallTime ? (performance.now() - lastResponseWallTime) / 1000 : 0;

            // 2. POI (LOD)
            MAP.pois.forEach(id => {
                let p = MAP.nodes[id];
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, ptRadius, 0, Math.PI * 2); ctx.fill();
                if (scale > 3.0) {
                    ctx.fillStyle = '#94a3b8'; ctx.font = `${8 / scale}px Arial`;
                    ctx.fillText(id, p.x + ptRadius, p.y - ptRadius);
                }
            });

            // 3. 车辆 & 平滑推演
            if (latestState && latestState.fleet) {
                latestState.fleet.forEach(v => {
                    let [vx, vy] = getExtrapolatedPos(v, wallElapsed);
                    if (v.pathQueue && v.pathQueue.length > 0) {
                        ctx.beginPath(); ctx.moveTo(vx, vy);
                        for (let q of v.pathQueue) ctx.lineTo(q.node.x, q.node.y);
                        ctx.strokeStyle = v.color; ctx.lineWidth = Math.max(0.8, 2.0 / scale);
                        ctx.globalAlpha = 0.5; ctx.stroke(); ctx.globalAlpha = 1.0;
                    }
                    let vRad = Math.max(2.5, 6.0 / scale);
                    ctx.shadowBlur = 10; ctx.shadowColor = v.color;
                    ctx.fillStyle = v.color; ctx.beginPath(); ctx.arc(vx, vy, vRad, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 0;

                    if (v.plannedRoute && scale > 1.5) {
                        v.plannedRoute.forEach((step, idx) => {
                            let tg = step.type === 'P' ? step.order.pNode : step.order.dNode;
                            ctx.fillStyle = step.type === 'P' ? '#0ea5e9' : '#ef4444';
                            let offset = (idx + 1) * ptRadius * 4;
                            ctx.beginPath(); ctx.arc(tg.x, tg.y - offset, ptRadius * 1.5, 0, Math.PI * 2); ctx.fill();
                            ctx.fillStyle = '#fff'; ctx.font = `${Math.max(6, 12 / scale)}px Arial`;
                            ctx.textAlign = 'center';
                            ctx.fillText(step.type, tg.x, tg.y - offset + (ptRadius * 1.5)/2);
                        });
                    }
                });
            }
            ctx.restore();
        }

        function renderFleetCards(state) {
            if (!state || !state.fleet) return;
            let html = '';
            state.fleet.forEach(v => {
                html += `<div class="vehicle-card" style="border-bottom: 3px solid ${v.color};">
                    <div class="vehicle-title" style="color:${v.color}">${v.id}</div>
                    <div class="vehicle-load">${v.onBoardCount}<span style="font-size:10px;color:#64748b"> / 10</span></div>
                </div>`;
            });
            document.getElementById('vPanel').innerHTML = html;
        }

        function renderOrders(state) {
            if (!state || !state.fleet || !state.activeOrders) return;
            const curSysTime = state.sysTime;
            let html = '';
            state.fleet.forEach(v => {
                html += `<div class="vehicle-eta-section" style="border-left: 3px solid ${v.color};">
                    <div class="vehicle-eta-title" style="color: ${v.color};">${v.id} 任务追踪卡</div>`;
                const vOrders = state.activeOrders.filter(ao => ao.vId === v.id);
                if (vOrders.length === 0) {
                    html += `<div style="font-size:11px; color:#64748b;">✅ 辖区空闲巡回待命中...</div>`;
                } else {
                    vOrders.forEach(ao => {
                        const isPick = ao.state === 'waiting';
                        const absTime = curSysTime + (isPick ? ao.pickRemain : ao.arrRemain);
                        html += `<div class="status-item" ${!isPick ? 'style="border-color: rgba(16,185,129,0.3); background:rgba(16,185,129,0.08);"' : ''}>
                            ${isPick ? '👉 将接驾' : '✔️ 运载中'} <b style="color:${isPick ? '#0ea5e9' : '#10b981'}">[单${ao.orderId}]</b>
                            | <span style="color:#94a3b8">预计: </span><b id="eta-${ao.orderId}" data-abs="${absTime}" style="color:#fcd34d">${(isPick ? ao.pickRemain : ao.arrRemain).toFixed(1)}s</b>
                        </div>`;
                    });
                }
                html += `</div>`;
            });
            orderStatusPanel.innerHTML = html;
        }

        /**
         * 每帧调用：仅更新倒计时数字的 textContent，无 DOM 重建，60fps 丝滑。
         *
         * 修复跳高 bug 原理：
         *   跳高来自 HTTP 传输延迟——即便对 localhost，响应也需要 10~50ms 才能到达。
         *   在这段延迟中前端已摹去更多时间，而后端需带回的新 remain
         *   是在较早时刻计算的——比前端当前显示值更大，导致回弹。
         *
         *   解决方案：用「绝对模拟时间锐」 (data-abs = sysTime + remain) 作锦点。
         *   实时估算的模拟时间 = lastSysTime + 墙钟已过 * 速率倍数。
         *   remain = max(0, absTime - estimatedSysTime) ——单调递减，不会因延迟跳回。
         */
        function updateEtaCountdowns() {
            if (!latestState || lastResponseWallTime === null) return;
            const wallElapsed = (performance.now() - lastResponseWallTime) / 1000.0;
            // 当前估算的模拟 sysTime（头尾相接，永远单调递增）
            const estimatedSysTime = lastSysTime + wallElapsed * speedMultiplier;
            if (!latestState.activeOrders) return;
            latestState.activeOrders.forEach(ao => {
                const el = document.getElementById(`eta-${ao.orderId}`);
                if (!el) return;
                const absTime = parseFloat(el.dataset.abs);
                const remain = Math.max(0, absTime - estimatedSysTime);
                el.textContent = `${remain.toFixed(1)}s`;
            });
        }

        // ── 主循环：按帧向后端请求 tick ──
        let lastTimestamp = null;
        let tickInFlight = false;
        let pendingDt = 0; // 累积真实流逝时间，tick 在途时不丢弃时间

        function animateFrame(timestamp) {
            if (!MAP) {
                lastTimestamp = timestamp;
                requestAnimationFrame(animateFrame);
                return;
            }

            // 每帧都累积 dt（乘以速率倍数），无论 tick 是否在途
            if (lastTimestamp !== null) {
                pendingDt += Math.min((timestamp - lastTimestamp) / 1000.0, 0.1) * speedMultiplier;
            }
            lastTimestamp = timestamp;

            // 非阻塞 tick：tick 结束后立刻用当时已累积的全量 dt 再发
            if (!tickInFlight && pendingDt > 0) {
                tickInFlight = true;
                const sendDt = pendingDt;
                pendingDt = 0; // 清零，后续帧重新累积
                fetch(`${BACKEND}/tick`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dt: sendDt })
                })
                .then(r => r.json())
                .then(state => {
                    latestState = state;
                    // 记录响应到达时的 sysTime 和本地墙钟
                    lastSysTime = state.sysTime;
                    lastResponseWallTime = performance.now();
                    if (state.logs) {
                        state.logs.forEach(log => addLog(log.msg, log.color, log.time));
                    }
                    renderFleetCards(state);
                    renderOrders(state);  // 重建 DOM 结构（低频）
                })
                .catch(err => console.warn('tick error:', err))
                .finally(() => { tickInFlight = false; });
            }

            updateEtaCountdowns(); // 每帧插值更新倒计时（高频，仅改 textContent）
            drawMap();
            requestAnimationFrame(animateFrame);
        }

        // ── 生成订单按钮 ──
        window.spawnOrder = async function () {
            document.getElementById('spawnBtn').disabled = true;
            try {
                const resp = await fetch(`${BACKEND}/spawn_order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                const state = await resp.json();
                latestState = state;
                // 记录响应到达时的 sysTime 和本地墙钟
                lastSysTime = state.sysTime;
                lastResponseWallTime = performance.now();
                if (state.logs) {
                    state.logs.forEach(log => addLog(log.msg, log.color, log.time));
                }
                renderFleetCards(state);
                renderOrders(state);  // 重建 DOM 结构
            } catch (e) {
                console.error('spawn_order error:', e);
                addLog('❌ 与后端通信失败，请确认 demo_backend.py 已启动。', '#ef4444', 0);
            } finally {
                document.getElementById('spawnBtn').disabled = false;
            }
        };

        // ── 初始化启动 ──
        fetchMapData()
            .then(() => {
                requestAnimationFrame(animateFrame);
            })
            .catch(err => {
                document.querySelector('.loading-text').textContent =
                    `❌ 无法连接后端：${err.message}。请先运行 python demo_backend.py`;
            });
    </script>
</body>

</html>
