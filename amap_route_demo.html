<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
    <title>高德地图 - 后端轨迹转驾车规划 Demo</title>
    <style>
        html,
        body,
        #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #111827;
        }

        .panel {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 340px;
            max-height: calc(100vh - 32px);
            overflow: auto;
            background: rgba(17, 24, 39, 0.92);
            color: #e5e7eb;
            border: 1px solid rgba(148, 163, 184, 0.35);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            padding: 14px;
            z-index: 99;
        }

        .panel h2 {
            margin: 0 0 10px;
            font-size: 16px;
            font-weight: 700;
        }

        .field {
            display: grid;
            gap: 4px;
            margin-bottom: 10px;
        }

        .field label {
            font-size: 12px;
            color: #9ca3af;
        }

        .field input,
        .field select {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #374151;
            border-radius: 6px;
            background: #0f172a;
            color: #e5e7eb;
            padding: 8px;
            font-size: 13px;
            outline: none;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 9px 10px;
            color: #ffffff;
            background: #2563eb;
            cursor: pointer;
            font-size: 13px;
        }

        button.secondary {
            background: #475569;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .status {
            white-space: pre-wrap;
            font-size: 12px;
            line-height: 1.55;
            color: #cbd5e1;
            border-top: 1px solid rgba(148, 163, 184, 0.25);
            padding-top: 10px;
        }

        .legend {
            display: grid;
            gap: 6px;
            margin-top: 8px;
            font-size: 12px;
            color: #cbd5e1;
        }

        .legend span::before {
            content: "";
            display: inline-block;
            width: 22px;
            height: 3px;
            margin-right: 8px;
            vertical-align: middle;
            border-radius: 999px;
            background: var(--line-color);
        }
    </style>
    <script>
        window._AMapSecurityConfig = {
            securityJsCode: "0b80fd2cbff37b5fa47b96173410c6ad"
        };
    </script>
    <script src="https://webapi.amap.com/maps?v=2.0&key=447d5396499811870f1d4f67542a978e&plugin=AMap.Driving,AMap.GraspRoad"></script>
</head>

<body>
    <div id="container"></div>

    <section class="panel">
        <h2>后端轨迹转高德驾车路线</h2>

        <div class="field">
            <label for="apiBaseInput">后端地址</label>
            <input id="apiBaseInput" value="http://127.0.0.1:5000">
        </div>

        <div class="field">
            <label for="vehicleSelect">车辆</label>
            <select id="vehicleSelect"></select>
        </div>

        <div class="field">
            <label for="coordTypeInput">后端轨迹坐标类型</label>
            <select id="coordTypeInput">
                <option value="none">已是高德坐标，不转换</option>
                <option value="gps">GPS/WGS84，转高德坐标</option>
            </select>
        </div>

        <div class="field">
            <label for="routeModeInput">展示方式</label>
            <select id="routeModeInput">
                <option value="grasproad">高德轨迹纠偏</option>
                <option value="driving">高德驾车规划</option>
                <option value="backend">直接绘制后端轨迹</option>
            </select>
        </div>

        <div class="actions">
            <button id="refreshBtn">刷新后端轨迹</button>
            <button id="loadFleetBtn" class="secondary">重新加载车辆</button>
        </div>

        <div class="legend">
            <span style="--line-color:#a855f7;">高德轨迹纠偏结果</span>
            <span style="--line-color:#22c55e;">高德驾车规划路线</span>
            <span style="--line-color:#60a5fa;">后端算法原始轨迹</span>
            <span style="--line-color:#16a34a;">订单上客点 O</span>
            <span style="--line-color:#e11d48;">订单下客点 D</span>
        </div>

        <div id="status" class="status">等待地图加载...</div>
    </section>

    <script>
        const MAX_CONTROL_POINTS = 80;
        const MAX_WAYPOINTS_PER_REQUEST = 16;
        const MAX_GRASP_ROAD_POINTS = 100;
        const GRASP_ROAD_POINT_INTERVAL_SECONDS = 5;

        const map = new AMap.Map("container", {
            zoom: 14,
            center: [113.400, 23.050],
            mapStyle: "amap://styles/normal"
        });

        const statusEl = document.getElementById("status");
        const apiBaseInput = document.getElementById("apiBaseInput");
        const vehicleSelect = document.getElementById("vehicleSelect");
        const coordTypeInput = document.getElementById("coordTypeInput");
        const routeModeInput = document.getElementById("routeModeInput");
        const refreshBtn = document.getElementById("refreshBtn");
        const loadFleetBtn = document.getElementById("loadFleetBtn");

        let driving = null;
        let graspRoad = null;
        let backendPolyline = null;
        let amapPolylines = [];
        let markers = [];
        let fleetById = new Map();

        function setStatus(message) {
            statusEl.textContent = message;
        }

        function setBusy(isBusy) {
            refreshBtn.disabled = isBusy;
            loadFleetBtn.disabled = isBusy;
            vehicleSelect.disabled = isBusy;
        }

        function toNumber(value) {
            const num = Number(value);
            return Number.isFinite(num) ? num : null;
        }

        function normalizePoint(point) {
            if (Array.isArray(point)) {
                const lon = toNumber(point[0]);
                const lat = toNumber(point[1]);
                return lon === null || lat === null ? null : { lon, lat };
            }

            const lon = toNumber(point.lon ?? point.lng ?? point.longitude ?? point.x);
            const lat = toNumber(point.lat ?? point.latitude ?? point.y);
            return lon === null || lat === null ? null : { lon, lat };
        }

        function normalizeRoutePoints(data) {
            const source = Array.isArray(data)
                ? data
                : (data.route?.points || data.planned_route_point || data.path || []);

            return source
                .map(normalizePoint)
                .filter(Boolean);
        }

        function asLngLat(point) {
            return new AMap.LngLat(point.lon, point.lat);
        }

        function asPath(points) {
            return points.map(point => [point.lon, point.lat]);
        }

        function clearOverlays() {
            if (backendPolyline) {
                map.remove(backendPolyline);
                backendPolyline = null;
            }
            if (amapPolylines.length) {
                map.remove(amapPolylines);
                amapPolylines = [];
            }
            if (markers.length) {
                map.remove(markers);
                markers = [];
            }
        }

        function drawBackendReference(points) {
            backendPolyline = new AMap.Polyline({
                path: asPath(points),
                strokeColor: "#60a5fa",
                strokeWeight: 4,
                strokeOpacity: 0.55,
                strokeStyle: "dashed",
                lineJoin: "round",
                lineCap: "round",
                zIndex: 40
            });
            map.add(backendPolyline);
        }

        function addMarker(point, label, color) {
            const marker = new AMap.Marker({
                position: [point.lon, point.lat],
                offset: new AMap.Pixel(-11, -26),
                content: [
                    `<div style="display:grid;place-items:center;width:22px;height:22px;`,
                    `border-radius:50%;background:${color};color:#fff;border:2px solid #fff;`,
                    `font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.3);">${label}</div>`
                ].join("")
            });
            markers.push(marker);
            map.add(marker);
        }

        function addOdMarker(segment, index) {
            if (!segment.target) {
                return;
            }

            const isOrigin = segment.type === "O";
            const label = isOrigin ? "O" : "D";
            const color = isOrigin ? "#16a34a" : "#e11d48";
            const title = [
                isOrigin ? "上客点" : "下客点",
                segment.requestId ? `订单 ${segment.requestId}` : null,
                segment.targetName || null
            ].filter(Boolean).join(" - ");
            const marker = new AMap.Marker({
                position: [segment.target.lon, segment.target.lat],
                offset: new AMap.Pixel(-12, -28),
                title,
                content: [
                    `<div style="position:relative;width:24px;height:42px;">`,
                    `<div style="display:grid;place-items:center;width:24px;height:24px;`,
                    `border-radius:50%;background:${color};color:#fff;border:2px solid #fff;`,
                    `font-size:12px;font-weight:800;box-shadow:0 2px 10px rgba(0,0,0,.35);">${label}</div>`,
                    `<div style="position:absolute;transform:translate(-50%,2px);left:50%;top:26px;`,
                    `background:rgba(15,23,42,.86);color:#fff;border-radius:4px;padding:1px 4px;`,
                    `font-size:10px;line-height:14px;white-space:nowrap;">${index + 1}</div>`,
                    `</div>`
                ].join("")
            });
            markers.push(marker);
            map.add(marker);
        }

        function drawOdMarkers(orderSegments) {
            orderSegments.forEach((segment, index) => addOdMarker(segment, index));
        }

        function sampleControlPoints(points, maxCount) {
            if (points.length <= maxCount) {
                return points.slice();
            }

            const result = [points[0]];
            const innerCount = maxCount - 2;
            for (let i = 1; i <= innerCount; i += 1) {
                const index = Math.round((i * (points.length - 1)) / (innerCount + 1));
                result.push(points[index]);
            }
            result.push(points[points.length - 1]);
            return result;
        }

        function buildDrivingGroups(points) {
            const controlPoints = sampleControlPoints(points, MAX_CONTROL_POINTS);
            const groups = [];
            let startIndex = 0;

            while (startIndex < controlPoints.length - 1) {
                const endIndex = Math.min(
                    startIndex + MAX_WAYPOINTS_PER_REQUEST + 1,
                    controlPoints.length - 1
                );
                groups.push(controlPoints.slice(startIndex, endIndex + 1));
                startIndex = endIndex;
            }

            return groups;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function toRadians(degrees) {
            return degrees * Math.PI / 180;
        }

        function toDegrees(radians) {
            return radians * 180 / Math.PI;
        }

        function distanceMeters(a, b) {
            const earthRadius = 6371000;
            const lat1 = toRadians(a.lat);
            const lat2 = toRadians(b.lat);
            const dLat = toRadians(b.lat - a.lat);
            const dLon = toRadians(b.lon - a.lon);
            const s =
                Math.sin(dLat / 2) ** 2
                + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
            return 2 * earthRadius * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
        }

        function bearingDegrees(a, b) {
            const lat1 = toRadians(a.lat);
            const lat2 = toRadians(b.lat);
            const dLon = toRadians(b.lon - a.lon);
            const y = Math.sin(dLon) * Math.cos(lat2);
            const x =
                Math.cos(lat1) * Math.sin(lat2)
                - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
            return (toDegrees(Math.atan2(y, x)) + 360) % 360;
        }

        function convertLngLatToPoint(lnglat) {
            if (Array.isArray(lnglat)) {
                return { lon: Number(lnglat[0]), lat: Number(lnglat[1]) };
            }
            if (typeof lnglat.getLng === "function" && typeof lnglat.getLat === "function") {
                return { lon: lnglat.getLng(), lat: lnglat.getLat() };
            }
            return { lon: Number(lnglat.lng), lat: Number(lnglat.lat) };
        }

        function extractDrivingPath(result) {
            const route = result.routes && result.routes[0];
            if (!route) {
                return [];
            }

            if (Array.isArray(route.path) && route.path.length) {
                return route.path.map(convertLngLatToPoint);
            }

            const path = [];
            for (const step of route.steps || []) {
                for (const point of step.path || []) {
                    path.push(convertLngLatToPoint(point));
                }
            }
            return path;
        }

        function searchDriving(group) {
            return new Promise((resolve, reject) => {
                const start = group[0];
                const end = group[group.length - 1];
                const waypoints = group.slice(1, -1).map(asLngLat);

                driving.search(
                    asLngLat(start),
                    asLngLat(end),
                    { waypoints },
                    (status, result) => {
                        if (status === "complete") {
                            const path = extractDrivingPath(result);
                            if (path.length >= 2) {
                                resolve(path);
                                return;
                            }
                        }
                        reject(new Error(`高德驾车规划失败：${status}`));
                    }
                );
            });
        }

        function buildGraspRoadOriginPath(points) {
            const sampledPoints = sampleControlPoints(points, MAX_GRASP_ROAD_POINTS);
            const startTimestamp = Math.floor(Date.now() / 1000);

            return sampledPoints.map((point, index) => {
                const previous = sampledPoints[index - 1] || point;
                const next = sampledPoints[index + 1] || point;
                const distanceFromPrevious = index === 0 ? 0 : distanceMeters(previous, point);
                const speed = index === 0
                    ? 20
                    : Math.max(5, Math.min(80, distanceFromPrevious / GRASP_ROAD_POINT_INTERVAL_SECONDS * 3.6));
                const angle = index < sampledPoints.length - 1
                    ? bearingDegrees(point, next)
                    : bearingDegrees(previous, point);

                return {
                    x: point.lon,
                    y: point.lat,
                    ag: angle,
                    tm: index === 0 ? startTimestamp : index * GRASP_ROAD_POINT_INTERVAL_SECONDS,
                    sp: speed
                };
            });
        }

        function extractGraspRoadPath(result) {
            const points = result?.data?.points || result?.points || [];
            return points
                .map(normalizePoint)
                .filter(Boolean);
        }

        function correctRouteByGraspRoad(points) {
            return new Promise((resolve, reject) => {
                if (!graspRoad) {
                    reject(new Error("高德轨迹纠偏插件未加载"));
                    return;
                }

                const originPath = buildGraspRoadOriginPath(points);
                graspRoad.driving(originPath, (error, result) => {
                    if (error) {
                        reject(new Error(`高德轨迹纠偏失败：${error.info || error.message || "未知错误"}`));
                        return;
                    }

                    const correctedPath = extractGraspRoadPath(result);
                    if (correctedPath.length < 2) {
                        reject(new Error("高德轨迹纠偏未返回有效轨迹"));
                        return;
                    }

                    resolve({
                        path: correctedPath,
                        inputCount: originPath.length,
                        distance: result.distance
                    });
                });
            });
        }

        function isOrderSegment(segment) {
            return segment
                && (segment.type === "O" || segment.type === "D")
                && segment.request_id !== undefined
                && segment.request_id !== null;
        }

        function appendPointIfDifferent(path, point) {
            if (!point) {
                return;
            }
            const last = path[path.length - 1];
            if (!last || distanceMeters(last, point) > 1) {
                path.push(point);
            }
        }

        function prependPointIfDifferent(path, point) {
            if (!point) {
                return;
            }
            const first = path[0];
            if (!first || distanceMeters(first, point) > 1) {
                path.unshift(point);
            }
        }

        function extractOrderSegments(rawData) {
            const rawSegments = Array.isArray(rawData?.route?.segments)
                ? rawData.route.segments
                : (Array.isArray(rawData?.segments) ? rawData.segments : []);
            const routePoints = normalizeRoutePoints(rawData);
            const currentPoint = routePoints[0] || null;

            const orderSegments = rawSegments
                .filter(isOrderSegment)
                .map((segment, index) => {
                    const targetSource = segment.target || segment.target_node;
                    const target = normalizePoint(targetSource);
                    const path = normalizeRoutePoints(segment.points || segment.path || []);
                    appendPointIfDifferent(path, target);
                    return {
                        index,
                        type: segment.type,
                        requestId: segment.request_id,
                        targetName: targetSource?.name || "",
                        target,
                        path
                    };
                })
                .filter(segment => segment.target && segment.path.length >= 2);

            if (orderSegments.length) {
                prependPointIfDifferent(orderSegments[0].path, currentPoint);
            }

            return orderSegments;
        }

        async function convertOrderSegmentsIfNeeded(orderSegments) {
            const convertedSegments = [];
            for (const segment of orderSegments) {
                const path = await convertPointsIfNeeded(segment.path);
                if (path.length < 2) {
                    continue;
                }
                convertedSegments.push({
                    ...segment,
                    path,
                    target: path[path.length - 1]
                });
            }
            return convertedSegments;
        }

        function appendMergedPath(mergedPath, path) {
            if (!path.length) {
                return;
            }
            if (!mergedPath.length) {
                mergedPath.push(...path);
                return;
            }

            const last = mergedPath[mergedPath.length - 1];
            const first = path[0];
            if (distanceMeters(last, first) <= 2) {
                mergedPath.push(...path.slice(1));
            } else {
                mergedPath.push(...path);
            }
        }

        async function correctOrderSegmentsByGraspRoad(orderSegments, onProgress) {
            const mergedPath = [];
            const segmentResults = [];
            let inputCount = 0;
            let distance = 0;

            for (let i = 0; i < orderSegments.length; i += 1) {
                const segment = orderSegments[i];
                if (onProgress) {
                    onProgress(segment, i, orderSegments.length);
                }

                try {
                    const corrected = await correctRouteByGraspRoad(segment.path);
                    appendMergedPath(mergedPath, corrected.path);
                    inputCount += corrected.inputCount;
                    distance += Number(corrected.distance) || 0;
                    segmentResults.push({
                        ...segment,
                        correctedCount: corrected.path.length,
                        inputCount: corrected.inputCount,
                        distance: corrected.distance,
                        fallback: false
                    });
                } catch (error) {
                    const fallbackInputCount = Math.min(segment.path.length, MAX_GRASP_ROAD_POINTS);
                    appendMergedPath(mergedPath, segment.path);
                    inputCount += fallbackInputCount;
                    segmentResults.push({
                        ...segment,
                        correctedCount: segment.path.length,
                        inputCount: fallbackInputCount,
                        distance: null,
                        fallback: true,
                        error: error.message
                    });
                }

                await sleep(120);
            }

            if (mergedPath.length < 2) {
                throw new Error("分段纠偏未生成有效轨迹");
            }

            return {
                path: mergedPath,
                segments: segmentResults,
                inputCount,
                distance,
                fallbackCount: segmentResults.filter(segment => segment.fallback).length
            };
        }

        function drawAmapDrivingSegments(segmentPaths) {
            amapPolylines = segmentPaths.map(path => new AMap.Polyline({
                path: asPath(path),
                strokeColor: "#22c55e",
                strokeWeight: 7,
                strokeOpacity: 0.9,
                lineJoin: "round",
                lineCap: "round",
                showDir: true,
                zIndex: 60
            }));
            map.add(amapPolylines);
        }

        function drawGraspRoadRoute(path) {
            const correctedLine = new AMap.Polyline({
                path: asPath(path),
                strokeColor: "#a855f7",
                strokeWeight: 7,
                strokeOpacity: 0.92,
                lineJoin: "round",
                lineCap: "round",
                showDir: true,
                zIndex: 70
            });
            amapPolylines = [correctedLine];
            map.add(correctedLine);
        }

        function drawFallbackRoute(points) {
            const fallback = new AMap.Polyline({
                path: asPath(points),
                strokeColor: "#f97316",
                strokeWeight: 6,
                strokeOpacity: 0.85,
                lineJoin: "round",
                lineCap: "round",
                showDir: true,
                zIndex: 65
            });
            amapPolylines = [fallback];
            map.add(fallback);
        }

        function fitRouteView() {
            const overlays = [
                backendPolyline,
                ...amapPolylines,
                ...markers
            ].filter(Boolean);
            if (overlays.length) {
                map.setFitView(overlays, false, [60, 60, 60, 380]);
            }
        }

        async function convertPointsIfNeeded(points) {
            const coordType = coordTypeInput.value;
            if (coordType === "none") {
                return points;
            }

            const converted = [];
            for (let i = 0; i < points.length; i += 40) {
                const chunk = points.slice(i, i + 40);
                const locations = await new Promise((resolve, reject) => {
                    AMap.convertFrom(asPath(chunk), coordType, (status, result) => {
                        if (status === "complete" && result.info === "ok") {
                            resolve(result.locations.map(convertLngLatToPoint));
                        } else {
                            reject(new Error("坐标转换失败"));
                        }
                    });
                });
                converted.push(...locations);
            }
            return converted;
        }

        async function renderRouteByAmap(rawPoints, title) {
            const validPoints = normalizeRoutePoints(rawPoints);
            if (validPoints.length < 2) {
                throw new Error("轨迹点不足，无法绘制路线");
            }

            setBusy(true);
            clearOverlays();

            const points = await convertPointsIfNeeded(validPoints);
            drawBackendReference(points);
            addMarker(points[0], "起", "#2563eb");
            addMarker(points[points.length - 1], "终", "#dc2626");
            const orderSegments = await convertOrderSegmentsIfNeeded(extractOrderSegments(rawPoints));
            drawOdMarkers(orderSegments);

            try {
                if (routeModeInput.value === "backend") {
                    drawFallbackRoute(points);
                    fitRouteView();
                    setStatus([
                        title,
                        `后端轨迹点：${validPoints.length}`,
                        orderSegments.length ? `订单OD点：${orderSegments.length}` : null,
                        "当前为直接绘制后端原始轨迹。"
                    ].filter(Boolean).join("\n"));
                    return;
                }

                if (routeModeInput.value === "grasproad") {
                    let corrected = null;
                    if (orderSegments.length) {
                        corrected = await correctOrderSegmentsByGraspRoad(
                            orderSegments,
                            (segment, index, total) => {
                                const actionText = segment.type === "O" ? "上客点" : "下客点";
                                setStatus([
                                    title,
                                    `正在按订单OD分段调用高德轨迹纠偏：第 ${index + 1}/${total} 段`,
                                    `${actionText}：订单 ${segment.requestId}`,
                                    segment.targetName ? `目标点：${segment.targetName}` : null
                                ].filter(Boolean).join("\n"));
                            }
                        );
                    } else {
                        setStatus(`${title}\n正在调用高德官方轨迹纠偏服务...`);
                        corrected = await correctRouteByGraspRoad(points);
                    }
                    drawGraspRoadRoute(corrected.path);
                    fitRouteView();
                    setStatus([
                        title,
                        `后端轨迹点：${validPoints.length}`,
                        orderSegments.length ? `订单OD点：${orderSegments.length}` : null,
                        orderSegments.length ? `分段纠偏数：${corrected.segments.length}` : null,
                        `纠偏输入点：${corrected.inputCount}`,
                        `纠偏返回点：${corrected.path.length}`,
                        corrected.distance ? `纠偏里程：${Number(corrected.distance).toFixed(0)} 米` : null,
                        corrected.fallbackCount ? `纠偏失败回退分段：${corrected.fallbackCount}` : null,
                        orderSegments.length
                            ? "紫色路线为按订单OD分段后的高德 GraspRoad 纠偏合并结果，O/D 点为订单上下客点。"
                            : "紫色路线为高德 GraspRoad 轨迹纠偏结果，蓝色虚线为后端原始轨迹参考。"
                    ].filter(Boolean).join("\n"));
                    return;
                }

                const groups = buildDrivingGroups(points);
                const segmentPaths = [];
                for (let i = 0; i < groups.length; i += 1) {
                    setStatus(`${title}\n正在调用高德驾车规划：第 ${i + 1}/${groups.length} 段...`);
                    segmentPaths.push(await searchDriving(groups[i]));
                    await sleep(120);
                }
                drawAmapDrivingSegments(segmentPaths);
                fitRouteView();
                setStatus([
                    title,
                    `后端轨迹点：${validPoints.length}`,
                    `高德控制点：${sampleControlPoints(points, MAX_CONTROL_POINTS).length}`,
                    `高德规划分段：${groups.length}`,
                    "绿色路线为高德驾车规划结果，蓝色虚线为后端原始轨迹参考。"
                ].join("\n"));
            } catch (error) {
                drawFallbackRoute(points);
                fitRouteView();
                setStatus([
                    title,
                    error.message,
                    "已回退为直接绘制后端原始轨迹。"
                ].join("\n"));
            } finally {
                setBusy(false);
            }
        }

        function getApiBase() {
            const apiBase = apiBaseInput.value.trim().replace(/\/$/, "");
            if (!apiBase) {
                throw new Error("请填写后端地址");
            }
            return apiBase;
        }

        function getSelectedVehicle() {
            const vehicleId = vehicleSelect.value;
            const vehicle = fleetById.get(vehicleId);
            if (!vehicle) {
                throw new Error("请先加载车辆列表");
            }

            const gps = vehicle.gps || {};
            const lon = toNumber(gps.lon);
            const lat = toNumber(gps.lat);
            if (lon === null || lat === null) {
                throw new Error(`车辆 ${vehicleId} 暂无后端 GPS，无法请求路径更新`);
            }

            return { vehicle, lon, lat };
        }

        function fillVehicleSelect(fleet) {
            fleetById = new Map();
            vehicleSelect.innerHTML = "";

            for (const vehicle of fleet) {
                fleetById.set(vehicle.id, vehicle);
                const option = document.createElement("option");
                const gps = vehicle.gps || {};
                const hasGps = Number.isFinite(Number(gps.lon)) && Number.isFinite(Number(gps.lat));
                option.value = vehicle.id;
                option.textContent = `${vehicle.id}${hasGps ? "" : "（无 GPS）"}`;
                vehicleSelect.appendChild(option);
            }
        }

        async function loadFleetFromBackend() {
            const apiBase = getApiBase();
            setStatus("正在从后端加载车辆列表...");

            const response = await fetch(`${apiBase}/fleet`);
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || `车队接口请求失败：${response.status}`);
            }

            const fleet = data.fleet || [];
            fillVehicleSelect(fleet);
            if (!fleet.length) {
                throw new Error("后端未返回车辆，请先初始化系统");
            }

            setStatus(`已加载 ${fleet.length} 辆车。请选择车辆后刷新后端轨迹。`);
            return fleet;
        }

        async function requestBackendPath() {
            const apiBase = getApiBase();
            const { vehicle, lon, lat } = getSelectedVehicle();

            setStatus(`正在请求车辆 ${vehicle.id} 的后端路径更新接口...`);
            const response = await fetch(`${apiBase}/fleet/${encodeURIComponent(vehicle.id)}/path`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ lon, lat })
            });

            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || `接口请求失败：${response.status}`);
            }

            await renderRouteByAmap(data, `车辆 ${vehicle.id} 路径更新成功\n后端 GPS：${lon.toFixed(6)}, ${lat.toFixed(6)}`);
        }

        async function loadFleetAndRenderFirstAvailable() {
            const fleet = await loadFleetFromBackend();
            const firstVehicleWithGps = fleet.find(vehicle => {
                const gps = vehicle.gps || {};
                return Number.isFinite(Number(gps.lon)) && Number.isFinite(Number(gps.lat));
            });

            if (!firstVehicleWithGps) {
                setStatus(`已加载 ${fleet.length} 辆车，但没有车辆带有后端 GPS。`);
                return;
            }

            vehicleSelect.value = firstVehicleWithGps.id;
            await requestBackendPath();
        }

        map.on("complete", () => {
            AMap.plugin(["AMap.Driving", "AMap.GraspRoad"], async () => {
                driving = new AMap.Driving({
                    policy: AMap.DrivingPolicy.LEAST_TIME,
                    extensions: "base",
                    showTraffic: false
                });
                graspRoad = new AMap.GraspRoad();
                await loadFleetAndRenderFirstAvailable();
            });
        });

        refreshBtn.addEventListener("click", () => {
            requestBackendPath().catch(error => {
                setBusy(false);
                setStatus(error.message);
            });
        });

        loadFleetBtn.addEventListener("click", () => {
            loadFleetAndRenderFirstAvailable().catch(error => {
                setBusy(false);
                setStatus(error.message);
            });
        });
    </script>
</body>

</html>
