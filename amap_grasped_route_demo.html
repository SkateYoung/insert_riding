<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
    <title>高德纠偏路线展示</title>
    <style>
        html,
        body,
        #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #0b1220;
        }

        .panel {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 10;
            width: 380px;
            max-height: calc(100vh - 32px);
            overflow: auto;
            box-sizing: border-box;
            padding: 14px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.94);
            color: #e5e7eb;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.35);
        }

        .panel h1 {
            margin: 0 0 12px;
            font-size: 17px;
            line-height: 1.3;
        }

        .field {
            display: grid;
            gap: 5px;
            margin-bottom: 10px;
        }

        .field label,
        .section-title {
            font-size: 12px;
            color: #9ca3af;
        }

        input,
        select,
        textarea,
        button {
            box-sizing: border-box;
            width: 100%;
            border-radius: 6px;
            font-size: 13px;
        }

        input,
        select,
        textarea {
            border: 1px solid #334155;
            padding: 8px;
            outline: none;
            background: #111827;
            color: #f8fafc;
        }

        textarea {
            min-height: 56px;
            resize: vertical;
        }

        .actions,
        .compact-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
        }

        .compact-actions {
            margin: 8px 0;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 8px 0 12px;
        }

        .tool-block {
            margin: 12px 0;
            padding: 10px;
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.54);
        }

        button {
            border: 0;
            padding: 9px 10px;
            background: #2563eb;
            color: #ffffff;
            cursor: pointer;
        }

        button.secondary {
            background: #475569;
        }

        button.danger {
            background: #b91c1c;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .divider {
            height: 1px;
            margin: 14px 0;
            background: rgba(148, 163, 184, 0.24);
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin: 8px 0 12px;
        }

        .tab-button {
            padding: 8px 6px;
            background: #1f2937;
            color: #cbd5e1;
            border: 1px solid #334155;
        }

        .tab-button.active {
            background: #2563eb;
            color: #fff;
            border-color: #60a5fa;
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        .mini-table {
            width: 100%;
            border-collapse: collapse;
            margin: 8px 0 12px;
            font-size: 12px;
        }

        .mini-table th,
        .mini-table td {
            border-bottom: 1px solid rgba(148, 163, 184, 0.22);
            padding: 6px 4px;
            text-align: left;
            vertical-align: top;
        }

        .mini-table button {
            padding: 5px 6px;
            font-size: 12px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .hidden {
            display: none;
        }

        .legend {
            display: grid;
            gap: 7px;
            margin: 10px 0;
            font-size: 12px;
            color: #cbd5e1;
        }

        .legend span::before {
            content: "";
            display: inline-block;
            width: 26px;
            height: 4px;
            margin-right: 8px;
            vertical-align: middle;
            border-radius: 999px;
            background: var(--line-color);
        }

        .hint {
            margin: 8px 0 0;
            color: #cbd5e1;
            font-size: 12px;
            line-height: 1.5;
        }

        .status {
            border-top: 1px solid rgba(148, 163, 184, 0.25);
            padding-top: 10px;
            white-space: pre-wrap;
            font-size: 12px;
            line-height: 1.55;
            color: #d1d5db;
        }

        .map-marker {
            min-width: 24px;
            height: 24px;
            padding: 0 6px;
            border-radius: 999px;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            line-height: 24px;
            text-align: center;
            border: 2px solid #fff;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.34);
            transform: translate(
                calc(-50% + var(--marker-dx, 0px)),
                calc(-50% + var(--marker-dy, 0px))
            );
            white-space: nowrap;
        }

        .map-marker.vehicle {
            min-width: 22px;
            width: 22px;
            height: 22px;
            padding: 0;
            line-height: 22px;
            background: #2563eb;
            font-size: 11px;
        }

        .map-marker.stop-o {
            background: #16a34a;
        }

        .map-marker.stop-d {
            background: #dc2626;
        }

        .map-marker.stop-other {
            background: #64748b;
        }
    </style>
    <script>
        window._AMapSecurityConfig = {
            securityJsCode: "0b80fd2cbff37b5fa47b96173410c6ad"
        };
    </script>

</head>

<body>
    <div id="container"></div>

    <section class="panel">
        <h1>高德纠偏路线展示</h1>

        <div class="tabs">
            <button class="tab-button active" type="button" data-tab="routeTab">路线展示</button>
            <button class="tab-button" type="button" data-tab="restrictionTab">运营禁区</button>
            <button class="tab-button" type="button" data-tab="adminTab">司机车辆</button>
        </div>

        <div id="routeTab" class="tab-panel active">
        <div class="field">
            <label for="apiBaseInput">后端地址</label>
            <input id="apiBaseInput" value="http://127.0.0.1:5000">
        </div>

        <div class="field">
            <label for="vehicleSelect">车辆</label>
            <select id="vehicleSelect"></select>
        </div>

        <div class="actions">
            <button id="loadFleetBtn" type="button">加载车队</button>

            <button id="clearBtn" type="button" class="secondary">清空地图</button>
        </div>

        <div class="tool-block">
            <div class="section-title">模拟随机订单</div>
            <div class="quick-actions">
                <button id="randomOrder1Btn" type="button">发起 1 单</button>
                <button id="randomOrder10Btn" type="button">发起 10 单</button>
                <button id="randomOrder50Btn" type="button">发起 50 单</button>
            </div>
        </div>

        <div class="legend">
            <span style="--line-color:#2563eb;">后端原始 A* 路线</span>
            <span style="--line-color:#a855f7;">后端高德纠偏路线</span>
            <span style="--line-color:#f97316;">纠偏分段路线</span>
            <span style="--line-color:#ef4444;">运营禁区</span>
        </div>
        </div>

        <div class="section-title">运营禁区策略</div>

        <div class="field">
            <label for="restrictionPolicySelect">策略</label>
            <select id="restrictionPolicySelect"></select>

        <div class="compact-actions">

        <div class="two-col">

        <div class="field">
            <label for="restrictionDescriptionInput">备注</label>
            <textarea id="restrictionDescriptionInput"></textarea>
        </div>

        <div class="compact-actions">
            <button id="drawRestrictionBtn" type="button">开始画禁区</button>

            <button id="saveRestrictionBtn" type="button">保存策略</button>
            <button id="activateRestrictionBtn" type="button" class="secondary">设为当前</button>

            <button id="clearRestrictionBtn" type="button" class="secondary">清空禁区图形</button>

        <div class="hint">选择已有策略后可继续绘制并闭合新禁区，保存后会追加到该策略；新增策略会先清空当前表单。画禁区时请按边界顺时针或逆时针依次点击，避免对角线交叉。</div>
        </div>

                    </div>

                    </div>
                    <div class="field">

                    </div>
                    <div class="field">

                    <div class="field">
                        <label for="newDriverWorkStatusSelect">工作状态</label>

                    </div>
                    <div class="field">
                        <label for="newDriverEmploymentStatusSelect">雇佣状态</label>
                        <select id="newDriverEmploymentStatusSelect"></select>
                    </div>
                    <div class="field">
                        <label for="newDriverServiceCityInput">服务城市</label>
                        <input id="newDriverServiceCityInput">
                    </div>
                </div>
                <div class="field">
                    <label for="newDriverRemarkInput">司机备注</label>

                </div>
                <div class="compact-actions">
                    <button id="createDriverBtn" type="button">保存新增司机</button>

            <div class="divider"></div>

                <div class="field">

                <button id="saveDriverBtn" type="button">保存司机修改</button>
                <button id="deleteDriverBtn" type="button" class="danger">删除司机</button>
            </div>

            <div class="divider"></div>
            <div class="section-title">新增车辆</div>
            <div class="compact-actions">
                <button id="newVehicleBtn" type="button">新添车辆</button>
            </div>
            <div id="newVehicleFormSection" class="hidden">
                <div class="form-grid">
                    <div class="field">
                        <label for="newVehicleCodeInput">车辆编码</label>

    <script>
        const apiBaseInput = document.getElementById("apiBaseInput");
        const vehicleSelect = document.getElementById("vehicleSelect");
        const loadFleetBtn = document.getElementById("loadFleetBtn");
        const refreshVehicleBtn = document.getElementById("refreshVehicleBtn");
        const updatePathBtn = document.getElementById("updatePathBtn");
        const clearBtn = document.getElementById("clearBtn");
        const randomOrder1Btn = document.getElementById("randomOrder1Btn");
        const randomOrder10Btn = document.getElementById("randomOrder10Btn");
        const randomOrder50Btn = document.getElementById("randomOrder50Btn");
        const statusEl = document.getElementById("status");

        const restrictionPolicySelect = document.getElementById("restrictionPolicySelect");
        const newRestrictionPolicyBtn = document.getElementById("newRestrictionPolicyBtn");
        const restrictionPolicyCodeInput = document.getElementById("restrictionPolicyCodeInput");
        const restrictionPolicyNameInput = document.getElementById("restrictionPolicyNameInput");
        const restrictionDescriptionInput = document.getElementById("restrictionDescriptionInput");
        const drawRestrictionBtn = document.getElementById("drawRestrictionBtn");
        const closeRestrictionBtn = document.getElementById("closeRestrictionBtn");
        const saveRestrictionBtn = document.getElementById("saveRestrictionBtn");
        const activateRestrictionBtn = document.getElementById("activateRestrictionBtn");
        const deleteRestrictionBtn = document.getElementById("deleteRestrictionBtn");
        const clearRestrictionBtn = document.getElementById("clearRestrictionBtn");
        const reloadRestrictionBtn = document.getElementById("reloadRestrictionBtn");

        const tabButtons = document.querySelectorAll(".tab-button");
        const tabPanels = document.querySelectorAll(".tab-panel");
        const reloadAdminBtn = document.getElementById("reloadAdminBtn");
        const resetAdminFormsBtn = document.getElementById("resetAdminFormsBtn");
        const newDriverBtn = document.getElementById("newDriverBtn");
        const newDriverFormSection = document.getElementById("newDriverFormSection");
        const newDriverCodeInput = document.getElementById("newDriverCodeInput");
        const newDriverNoInput = document.getElementById("newDriverNoInput");
        const newDriverNameInput = document.getElementById("newDriverNameInput");
        const newDriverPhoneInput = document.getElementById("newDriverPhoneInput");
        const newDriverIdCardInput = document.getElementById("newDriverIdCardInput");
        const newDriverLicenseNoInput = document.getElementById("newDriverLicenseNoInput");
        const newDriverLicenseClassInput = document.getElementById("newDriverLicenseClassInput");
        const newDriverLicenseExpireInput = document.getElementById("newDriverLicenseExpireInput");
        const newDriverWorkStatusSelect = document.getElementById("newDriverWorkStatusSelect");
        const newDriverEmploymentStatusSelect = document.getElementById("newDriverEmploymentStatusSelect");

        async function fetchJson(url, options) {
            const response = await fetch(url, options);
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(data.error || data.message || `${response.status} ${response.statusText}`);
            }
            return data;
        }

        async function apiJson(path, options = {}) {
            const init = {
                headers: { "Content-Type": "application/json" },
                ...options
            };
            if (init.body && typeof init.body !== "string") {
                init.body = JSON.stringify(init.body);
            }
            return fetchJson(`${apiBase()}${path}`, init);
        }

        function toNumber(value) {
            const num = Number(value);
            return Number.isFinite(num) ? num : null;
        }

        function normalizePoint(point) {
            if (!point) {
                return null;
            }
            if (Array.isArray(point)) {
                const lon = toNumber(point[0]);
                const lat = toNumber(point[1]);
                return lon === null || lat === null ? null : { lon, lat };
            }
            const lon = toNumber(point.lon ?? point.lng ?? point.longitude ?? point.x);
            const lat = toNumber(point.lat ?? point.latitude ?? point.y);
            if (lon === null || lat === null) {
                return null;
            }
            return {
                ...point,
                lon,
                lat
            };
        }

        function normalizePoints(points) {
            const out = [];
            for (const item of points || []) {
                const point = normalizePoint(item);
                if (!point) {
                    continue;
                }
                const last = out[out.length - 1];
                if (last && Math.abs(last.lon - point.lon) < 1e-10 && Math.abs(last.lat - point.lat) < 1e-10) {
                    continue;
                }
                out.push(point);
            }
            return out;
        }

        function asLngLat(points) {
            return points.map(point => [point.lon, point.lat]);
        }

        function clearMap() {
            if (layers.length) {
                map.remove(layers);
            }
            layers = [];
            markerPositionCounts = new Map();
        }

        function addPolyline(points, options) {
            const normalized = normalizePoints(points);
            if (normalized.length < 2) {
                return null;
            }
            const polyline = new AMap.Polyline({
                path: asLngLat(normalized),
                showDir: true,
                ...options
            });
            layers.push(polyline);
            map.add(polyline);
            return polyline;
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function markerPositionKey(point) {
            return `${point.lon.toFixed(6)},${point.lat.toFixed(6)}`;
        }

        function markerOffsetForIndex(index) {
            if (index <= 0) {
                return { dx: 0, dy: 0 };
            }
            const ring = Math.ceil(index / 8);
            const slot = (index - 1) % 8;
            const angle = -Math.PI / 2 + slot * (Math.PI * 2 / 8);
            const radius = 24 * ring;
            return {
                dx: Math.round(Math.cos(angle) * radius),
                dy: Math.round(Math.sin(angle) * radius)
            };
        }

        function nextMarkerPlacement(point) {
            const key = markerPositionKey(point);
            const index = markerPositionCounts.get(key) || 0;
            markerPositionCounts.set(key, index + 1);
            return {
                index,
                ...markerOffsetForIndex(index)
            };
        }

        function markerStyle(color, placement) {
            const styles = [
                `--marker-dx:${placement.dx}px`,
                `--marker-dy:${placement.dy}px`
            ];
            if (color) {
                styles.push(`background:${color}`);
            }
            return ` style="${styles.join(";")}"`;
        }

        function addMarker(point, label, color, className = "") {
            const normalized = normalizePoint(point);
            if (!normalized) {
                return null;
            }
            const placement = nextMarkerPlacement(normalized);
            const style = markerStyle(color, placement);
            const marker = new AMap.Marker({
                position: [normalized.lon, normalized.lat],
                offset: new AMap.Pixel(0, 0),
                content: `<div class="map-marker ${className}"${style}>${escapeHtml(label)}</div>`,
                zIndex: 120 + placement.index
            });
            layers.push(marker);
            map.add(marker);
            return marker;
        }

        function addRouteStopMarker(point, segment, index) {
            const type = String(segment.type || "").toUpperCase();
            if (type === "O") {
                return addMarker(point, `O${index + 1}`, null, "stop-o");
            }
            if (type === "D") {
                return addMarker(point, `D${index + 1}`, null, "stop-d");
            }
            return addMarker(point, `S${index + 1}`, null, "stop-other");
        }

        function fitVisible(points, customLayers) {
            const normalized = normalizePoints(points);
            const targetLayers = customLayers || layers;
            if (normalized.length >= 2 && targetLayers.length) {
                map.setFitView(targetLayers, false, [70, 40, 40, 390]);
            } else if (normalized.length === 1) {
                map.setCenter([normalized[0].lon, normalized[0].lat]);
            }
        }

        function segmentTarget(segment) {
            return normalizePoint(segment.target_node || segment.target)
                || normalizePoint((segment.points || segment.path || [])[Math.max(0, (segment.points || segment.path || []).length - 1)]);
        }

        function drawVehicle(vehicle, options = {}) {
            clearMap();

            const vehicleRawPoints = normalizePoints(vehicle.planned_route_point || []);
            const rawPoints = vehicleRawPoints.length ? vehicleRawPoints : normalizePoints(options.rawPoints || []);
            const graspedPoints = normalizePoints(vehicle.planned_route_grasped_point || []);
            const segments = vehicle.planned_route_segment_grasped_point || [];

            addPolyline(rawPoints, {
                strokeColor: "#2563eb",
                strokeWeight: 5,
                strokeOpacity: 0.75,
                strokeStyle: "dashed",
                zIndex: 40
            });

            for (const [index, segment] of segments.entries()) {
                addPolyline(segment.points || segment.path || [], {
                    strokeColor: "#f97316",
                    strokeWeight: 7,
                    strokeOpacity: 0.42,
                    zIndex: 45 + index
                });
                const target = segmentTarget(segment);
                if (target) {
                    addRouteStopMarker(target, segment, index);
                }
            }

            addPolyline(graspedPoints, {
                strokeColor: "#a855f7",
                strokeWeight: 6,
                strokeOpacity: 0.95,
                zIndex: 80
            });

            const gps = normalizePoint(vehicle.gps);
            if (gps) {
                addMarker(gps, "车", null, "vehicle");
            }

            const fitPoints = graspedPoints.length >= 2 ? graspedPoints : rawPoints;
            fitVisible(fitPoints);

            const segmentStats = segments.map((segment, index) => {
                const count = normalizePoints(segment.points || segment.path || []).length;
                const source = segment.source || "raw";
                const requestPoints = segment.grasp?.request_points;
                return `${index + 1}. ${segment.type || "-"} ${segment.request_id || ""} ${source} ${count}点${requestPoints ? ` 输入${requestPoints}点` : ""}`;
            });
            const displayVehicleId = vehicle.vehicle_id || vehicle.id || "";

            setStatus([
                `车辆：${displayVehicleId}`,
                `纠偏状态：${vehicle.planned_route_grasp_status || "none"}`,
                vehicle.operation_restriction_policy_signature ? `禁区策略：${vehicle.operation_restriction_policy_signature}` : null,
                vehicle.planned_route_grasp_error ? `纠偏错误：${vehicle.planned_route_grasp_error}` : null,
                `原始路线点：${rawPoints.length}`,
                `纠偏总路线点：${graspedPoints.length}`,
                `纠偏分段数：${segments.length}`,
                segmentStats.length ? `分段：\n${segmentStats.join("\n")}` : null,
                options.message || null
            ].filter(Boolean).join("\n"));
        }

        async function loadFleet() {
            setBusy(true);
            try {
                const data = await fetchJson(`${apiBase()}/fleet`);
                const fleet = data.fleet || [];
                fleetById.clear();
                vehicleSelect.innerHTML = "";
                for (const vehicle of fleet) {
                    const vehicleId = vehicle.vehicle_id;
                    if (!vehicleId) {
                        continue;
                    }
                    fleetById.set(vehicleId, vehicle);
                    const option = document.createElement("option");
                    option.value = vehicleId;
                    option.textContent = `${vehicleId} - ${vehicle.plate_no || vehicle.id || "未命名"} - ${vehicle.planned_route_grasp_status || "none"}`;
                    vehicleSelect.appendChild(option);
                }
                if (!vehicleSelect.options.length) {
                    setStatus("车队为空。");
                    return;
                }
                const selected = fleet.find(vehicle => vehicle.vehicle_id && (vehicle.planned_route_grasped_point || []).length >= 2)
                    || fleet.find(vehicle => vehicle.vehicle_id);
                vehicleSelect.value = selected.vehicle_id;
                drawVehicle(selected, { message: "车队已加载。" });
            } catch (error) {
                setStatus(`加载车队失败：${error.message}`);

                setBusy(false);
            }
        }

        async function loadSelectedVehicle(message) {

                throw new Error("未选择车辆");

            const vehicle = await fetchJson(`${apiBase()}/fleet/${encodeURIComponent(vehicleId)}`);
            fleetById.set(vehicle.vehicle_id, vehicle);
            drawVehicle(vehicle, { message });
            return vehicle;
        }

        async function waitForGraspReady(vehicleId, routeVersion) {
            for (let attempt = 1; attempt <= 12; attempt += 1) {
                await new Promise(resolve => setTimeout(resolve, 700));
                const vehicle = await fetchJson(`${apiBase()}/fleet/${encodeURIComponent(vehicleId)}`);
                const status = vehicle.planned_route_grasp_status;
                const versionMatched = !routeVersion || vehicle.planned_route_grasp_route_version === routeVersion;
                if (versionMatched && (status === "ready" || status === "error" || status === "disabled" || status === "stale")) {
                    drawVehicle(vehicle, { message: `异步纠偏已返回，轮询次数：${attempt}` });
                    return vehicle;
                }
                drawVehicle(vehicle, { message: `等待异步纠偏返回：${attempt}/12` });
            }
            return loadSelectedVehicle("等待超时，请稍后刷新车辆。");
        }

        async function triggerPathUpdate() {
            const vehicleId = selectedVehicleId();
            const current = fleetById.get(vehicleId) || await loadSelectedVehicle();
            const gps = normalizePoint(current.gps);
            if (!gps) {
                throw new Error("当前车辆没有 GPS 坐标");
            }

            setStatus(`正在提交路径更新：${vehicleId}`);
            const data = await fetchJson(`${apiBase()}/fleet/${encodeURIComponent(vehicleId)}/path`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ lon: gps.lon, lat: gps.lat })
            });
            const rawPoints = normalizePoints(data.route?.points || data.path || data.planned_route_point || []);
            const vehicle = await fetchJson(`${apiBase()}/fleet/${encodeURIComponent(vehicleId)}`);
            drawVehicle(vehicle, {
                rawPoints,
                message: `路径更新已提交，等待后端异步纠偏。\n本次路径返回点：${rawPoints.length}`
            });
            await waitForGraspReady(vehicleId, vehicle.planned_route_grasp_route_version);
        }

        function formatLocalDateTime(date) {
            const pad = value => String(value).padStart(2, "0");
            return [
                date.getFullYear(),
                pad(date.getMonth() + 1),
                pad(date.getDate())
            ].join("-") + " " + [
                pad(date.getHours()),
                pad(date.getMinutes()),
                pad(date.getSeconds())
            ].join(":");
        }

        async function loadPoisForRandomOrders() {
            if (cachedPois && cachedPois.length >= 2) {
                return cachedPois;
            }
            const data = await apiJson("/pois");
            cachedPois = (data.pois || [])
                .map(poi => {
                    const point = normalizePoint(poi);
                    return point ? { ...poi, ...point } : null;
                })
                .filter(Boolean);
            if (cachedPois.length < 2) {
                throw new Error("可用 POI 不足，无法生成随机订单");
            }
            return cachedPois;
        }

        function buildRandomOrderPayload(pois, index) {
            const originIndex = Math.floor(Math.random() * pois.length);
            let destinationIndex = Math.floor(Math.random() * (pois.length - 1));
            if (destinationIndex >= originIndex) {
                destinationIndex += 1;
            }
            const origin = pois[originIndex];
            const destination = pois[destinationIndex];
            const earliest = new Date(Date.now() + (3 + Math.floor(Math.random() * 9)) * 60 * 1000);
            const latest = new Date(earliest.getTime() + (12 + Math.floor(Math.random() * 10)) * 60 * 1000);
            return {
                request_id: `demo-${Date.now()}-${index + 1}-${Math.floor(Math.random() * 100000)}`,
                origin: { lon: origin.lon, lat: origin.lat },
                destination: { lon: destination.lon, lat: destination.lat },
                expected_pickup_time: {
                    earliest: formatLocalDateTime(earliest),
                    latest: formatLocalDateTime(latest)
                },
                passenger_count: 1 + Math.floor(Math.random() * 3)
            };
        }

        async function createRandomOrders(count) {
            setBusy(true);
            const created = [];
            const errors = [];
            try {
                const pois = await loadPoisForRandomOrders();
                for (let index = 0; index < count; index += 1) {
                    const payload = buildRandomOrderPayload(pois, index);
                    try {
                        const result = await apiJson("/order", {
                            method: "POST",
                            body: payload
                        });
                        created.push(result.request_id || payload.request_id);
                    } catch (error) {
                        errors.push(`${payload.request_id}: ${error.message}`);
                    }
                    if (count === 1 || (index + 1) % 5 === 0 || index + 1 === count) {
                        setStatus(`随机订单提交中：${index + 1}/${count}\n成功：${created.length}\n失败：${errors.length}`);
                    }
                }
                await loadFleet();
                setStatus([
                    `随机订单提交完成：${created.length}/${count}`,
                    errors.length ? `失败：${errors.length}` : null,
                    created.length ? `最近订单：${created.slice(-5).join(", ")}` : null
                ].filter(Boolean).join("\n"));
            } catch (error) {
                setStatus(`随机订单提交失败：${error.message}`);
            } finally {
                setBusy(false);
            }
        }

        function pointFromLngLat(lnglat) {
            return {
                lon: Number(lnglat.lng.toFixed(6)),
                lat: Number(lnglat.lat.toFixed(6))
            };
        }

        function clearRestrictionLayers() {
            if (restrictionLayers.length) {
                map.remove(restrictionLayers);
            }
            restrictionLayers = [];
            if (draftRestrictionLine) {
                map.remove(draftRestrictionLine);
                draftRestrictionLine = null;
            }
        }

        function renderRestrictionPolygon(points, isActive) {
            const normalized = normalizePoints(points);
            if (normalized.length < 3) {
                return null;
            }
            const polygon = new AMap.Polygon({
                path: asLngLat(normalized),
                strokeColor: isActive ? "#ef4444" : "#f97316",
                strokeWeight: isActive ? 3 : 2,
                fillColor: "#ef4444",
                fillOpacity: isActive ? 0.22 : 0.14,
                zIndex: 30
            });
            restrictionLayers.push(polygon);
            map.add(polygon);
            return polygon;
        }

        function renderRestrictionPolygons(shouldFit = false) {
            clearRestrictionLayers();
            for (const polygon of restrictionPolygons) {
                renderRestrictionPolygon(polygon.points || polygon, true);
            }
            if (shouldFit && restrictionLayers.length) {
                map.setFitView(restrictionLayers, false, [70, 40, 40, 390]);
            }
        }

        function renderDraftRestrictionLine() {
            if (draftRestrictionLine) {
                map.remove(draftRestrictionLine);
            }
            if (draftRestrictionPoints.length < 1) {
                draftRestrictionLine = null;
                return;
            }
            draftRestrictionLine = new AMap.Polyline({
                path: asLngLat(draftRestrictionPoints),
                strokeColor: "#f97316",
                strokeWeight: 3,
                strokeStyle: "dashed",
                zIndex: 70
            });
            map.add(draftRestrictionLine);
        }

        function closeCurrentRestriction() {
            if (draftRestrictionPoints.length < 3) {
                setStatus("当前禁区至少需要 3 个顶点。");
                return;
            }
            restrictionPolygons.push({
                name: `polygon-${restrictionPolygons.length + 1}`,
                points: draftRestrictionPoints.slice()
            });
            draftRestrictionPoints = [];
            isDrawingRestriction = false;
            renderRestrictionPolygons(true);
            setStatus(`已闭合当前禁区，当前策略共有 ${restrictionPolygons.length} 个禁区。保存后会写入该策略。`);
        }

        function selectedRestrictionPolicy() {

        function buildNewRestrictionPolicyCode() {
            const timestamp = new Date()
                .toISOString()
                .slice(0, 19)
                .replace(/[-:T]/g, "");
            return `restriction-${timestamp}`;
        }

        function resetRestrictionPolicyForm(message) {

        function loadPolicyIntoForm(policy) {
            if (!policy) {
                resetRestrictionPolicyForm();

            }
            restrictionPolicyCodeInput.value = policy.policy_code || "";
            restrictionPolicyNameInput.value = policy.policy_name || "";
            restrictionPolicyNameInput.readOnly = true;
            restrictionDescriptionInput.value = policy.description || "";
            restrictionPolygons = (policy.polygons || policy.polygons_json || []).map(item => ({
                name: item.name,
                points: normalizePoints(item.points || item)
            }));
            draftRestrictionPoints = [];
            isDrawingRestriction = false;
            renderRestrictionPolygons(true);
            renderDraftRestrictionLine();
        }

        async function loadRestrictionPolicies(message, preferredPolicyCode) {
            setRestrictionBusy(true);
            try {
                const data = await apiJson("/operation-restrictions/policies");
                restrictionPolicies = data.policies || [];
            restrictionPolicySelect.innerHTML = "";
                const emptyOption = document.createElement("option");
                emptyOption.value = "";
                emptyOption.textContent = restrictionPolicies.length ? "请选择策略或新增策略" : "暂无策略，请新增";
                restrictionPolicySelect.appendChild(emptyOption);
                for (const policy of restrictionPolicies) {
                    const option = document.createElement("option");
                    option.value = policy.policy_name;
                    const polygonCount = policy.polygon_count ?? (policy.polygons || []).length;
                    option.textContent = `${policy.is_active ? "[当前] " : ""}${policy.policy_name || policy.policy_code}（编号：${policy.policy_code || "-"}，${polygonCount} 个禁区）`;
                    restrictionPolicySelect.appendChild(option);
                }
                const currentName = preferredPolicyCode || restrictionPolicySelect.value;
                const selectedPolicy = restrictionPolicies.find(policy => policy.policy_name === currentName);
                const activePolicy = restrictionPolicies.find(policy => policy.is_active);
                const policyToLoad = selectedPolicy || activePolicy || restrictionPolicies[0] || null;
                if (policyToLoad) {
                    restrictionPolicySelect.value = policyToLoad.policy_name;
                    loadPolicyIntoForm(policyToLoad);
                } else {
                    resetRestrictionPolicyForm();
                }
                setStatus(message || `已从数据库查询 ${restrictionPolicies.length} 个禁区策略。`);
            } catch (error) {
                setStatus(`加载禁区策略失败：${error.message}`);
            } finally {
                setRestrictionBusy(false);
            }
        }

        async function saveRestrictionPolicy() {
            if (!restrictionPolicyCodeInput.value.trim()) {
                throw new Error("请填写策略编号");
            }
            if (!restrictionPolygons.length) {
                throw new Error("请至少绘制并闭合一个禁区");
            }
            const payload = {
                policy_code: restrictionPolicyCodeInput.value.trim(),
                policy_name: restrictionPolicyNameInput.value.trim() || restrictionPolicyCodeInput.value.trim(),
                description: restrictionDescriptionInput.value.trim(),
                polygons: restrictionPolygons
            };
            const selectedPolicy = selectedRestrictionPolicy();
            const duplicatedName = restrictionPolicies.some(policy =>
                policy.policy_name === payload.policy_name
                && (!selectedPolicy || policy.policy_name !== selectedPolicy.policy_name)
            );
            if (duplicatedName) {
                throw new Error("禁区策略名称已存在，请更换名称");
            }
            const isUpdating = Boolean(selectedPolicy);
            await apiJson(
                isUpdating
                    ? `/operation-restrictions/policies/${encodeURIComponent(selectedPolicy.policy_name)}`
                    : "/operation-restrictions/policies",
                {
                    method: isUpdating ? "PUT" : "POST",
                    body: payload
                }
            );
            await loadRestrictionPolicies(`禁区策略已保存：${payload.policy_name}`, payload.policy_name);
        }

        function fillRecordSelect(select, records, valueKey, labelBuilder, currentValue, placeholder) {
            select.innerHTML = "";
            const emptyOption = document.createElement("option");
            emptyOption.value = "";
            emptyOption.textContent = placeholder;
            select.appendChild(emptyOption);
            for (const record of records || []) {
                const option = document.createElement("option");
                option.value = record[valueKey] || "";
                option.textContent = labelBuilder(record);
                select.appendChild(option);
            }
            select.value = currentValue || "";
        }

        resetAdminFormsBtn.addEventListener("click", () => {
            resetAdminForms();
            setStatus("司机车辆表单已清空。");
        });
        newDriverBtn.addEventListener("click", () => {
            resetNewDriverForm();
            newDriverFormSection.classList.remove("hidden");
            setStatus("已打开新增司机表单。");
        });
        editDriverSelect.addEventListener("change", () => {
            const driver = adminDrivers.find(item => item.driver_code === editDriverSelect.value);
            if (driver) {
                loadDriverIntoForm(driver);
            } else {
                resetDriverForm();
            }
        });
        driverTableBody.addEventListener("click", event => {
            const button = event.target.closest("[data-driver-code]");
            if (!button) {
                return;
            }
            const driver = adminDrivers.find(item => item.driver_code === button.dataset.driverCode);
            if (driver) {
                loadDriverIntoForm(driver);
            }
        });
        newVehicleBtn.addEventListener("click", () => {
            resetNewVehicleForm();
            newVehicleFormSection.classList.remove("hidden");
            setStatus("已打开新增车辆表单。");
        });
        editVehicleSelect.addEventListener("change", () => {
            const vehicle = adminVehicles.find(item => item.vehicle_code === editVehicleSelect.value);
            if (vehicle) {
                loadVehicleIntoForm(vehicle);
            } else {
                resetVehicleForm();
            }
        });
        vehicleTableBody.addEventListener("click", event => {
            const button = event.target.closest("[data-vehicle-code]");
            if (!button) {
                return;
            }
            const vehicle = adminVehicles.find(item => item.vehicle_code === button.dataset.vehicleCode);
            if (vehicle) {
                loadVehicleIntoForm(vehicle);
            }
        });
        createDriverBtn.addEventListener("click", async () => {
            setAdminBusy(true);
            try {
                await createDriver();
            } catch (error) {
                setStatus(`新增司机失败：${error.message}`);
            } finally {
                setAdminBusy(false);
            }
        });
        saveDriverBtn.addEventListener("click", async () => {
            setAdminBusy(true);
            try {
                await saveDriver();
            } catch (error) {
                setStatus(`保存司机失败：${error.message}`);
            } finally {
                setAdminBusy(false);
            }
        });
        deleteDriverBtn.addEventListener("click", async () => {
            setAdminBusy(true);
            try {
                await deleteDriver();
            } catch (error) {
                setStatus(`删除司机失败：${error.message}`);
            } finally {
                setAdminBusy(false);
            }
        });
        pickNewVehiclePositionBtn.addEventListener("click", () => {
            vehiclePositionTarget = "new";
            isDrawingRestriction = false;
            renderDraftRestrictionLine();
            setStatus("请在地图上点击新增车辆初始位置。");
        });
        pickVehiclePositionBtn.addEventListener("click", () => {
            vehiclePositionTarget = "edit";
            isDrawingRestriction = false;
            renderDraftRestrictionLine();
            setStatus("请在地图上点击当前车辆位置。");
        });
        createVehicleBtn.addEventListener("click", async () => {
            setAdminBusy(true);
            try {
                await createVehicle();
            } catch (error) {
                setStatus(`新增车辆失败：${error.message}`);
            } finally {
                setAdminBusy(false);
            }
        });
        saveVehicleBtn.addEventListener("click", async () => {
            setAdminBusy(true);
            try {
                await saveVehicle();
            } catch (error) {
                setStatus(`保存车辆失败：${error.message}`);
            } finally {
                setAdminBusy(false);
            }
        });
        applyVehicleStatusBtn.addEventListener("click", async () => {
            setAdminBusy(true);
            try {
                await applyVehicleStatus();
            } catch (error) {
                setStatus(`更新车辆状态失败：${error.message}`);
            } finally {
                setAdminBusy(false);
            }
        });
        bindVehicleDriverBtn.addEventListener("click", async () => {
            setAdminBusy(true);
            try {
                await bindVehicleDriver();
            } catch (error) {
                setStatus(`绑定司机失败：${error.message}`);
            } finally {
                setAdminBusy(false);
            }
        });
        deleteVehicleBtn.addEventListener("click", async () => {
            setAdminBusy(true);
            try {
                await deleteVehicle();
            } catch (error) {
                setStatus(`删除车辆失败：${error.message}`);
            } finally {
                setAdminBusy(false);
            }
        });

        loadFleet();
        loadRestrictionPolicies();
        loadAdminOptions();
    </script>
</body>

</html>
