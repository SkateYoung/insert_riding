<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>车辆实时路径更新测试</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            color: #1f2937;
            background: #f3f4f6;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 380px;
            height: 100vh;
        }

        .map-panel {
            position: relative;
            min-width: 0;
            background: #0f172a;
        }

        #mapCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .map-tip {
            position: absolute;
            left: 12px;
            top: 12px;
            padding: 8px 10px;
            color: #e5e7eb;
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(148, 163, 184, 0.35);
            border-radius: 6px;
            font-size: 13px;
        }

        .side-panel {
            overflow: auto;
            padding: 18px;
            background: #ffffff;
            border-left: 1px solid #d1d5db;
        }

        h1 {
            margin: 0 0 14px;
            font-size: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: 600;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            font-size: 14px;
        }

        button {
            cursor: pointer;
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }

        .order-buttons {
            grid-template-columns: 1fr;
        }

        .fleet-info {
            margin-top: 6px;
            padding: 8px;
            min-height: 42px;
            white-space: pre-wrap;
            background: #f9fafb;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.45;
        }

        #summary {
            margin-top: 14px;
            padding: 10px;
            min-height: 118px;
            white-space: pre-wrap;
            background: #f9fafb;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
        }

        pre {
            margin-top: 12px;
            padding: 10px;
            max-height: 320px;
            overflow: auto;
            color: #e5e7eb;
            background: #111827;
            border-radius: 6px;
            font-size: 12px;
        }

        .muted {
            color: #6b7280;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="layout">
        <div class="map-panel">
            <canvas id="mapCanvas"></canvas>
            <div class="map-tip">滚轮缩放，拖拽平移，点击地图可写入备用 GPS 坐标。</div>
        </div>

        <aside class="side-panel">
            <h1>车辆实时路径更新测试</h1>
            <div class="muted">
                路网由后端 `main.py` 从 `dxc_traffic_shp/dxc_rule.shp` 加载后返回，前端只负责绘图和周期性调用路径更新接口。
            </div>

            <div class="button-row">
                <button id="initBtn">初始化系统</button>
                <button id="loadBtn">加载地图</button>
            </div>

            <label>车队</label>
            <div id="fleetInfo" class="fleet-info">未加载车辆。</div>

            <label for="poiSelect">快速填入 POI 坐标</label>
            <select id="poiSelect"></select>

            <label for="lonInput">备用 GPS 经度 lon</label>
            <input id="lonInput" type="number" step="0.000001" placeholder="例如 113.400432">

            <label for="latInput">备用 GPS 纬度 lat</label>
            <input id="latInput" type="number" step="0.000001" placeholder="例如 23.058342">

            <div class="button-row">
                <button id="submitBtn">更新全部车辆路径</button>
                <button id="realtimeBtn">开始全部实时更新</button>
            </div>
            <div class="button-row order-buttons">
                <button id="createOrderBtn">创建随机订单</button>
                <button id="create10OrdersBtn">一键增加十个随机订单</button>
                <button id="create50OrdersBtn">一键增加五十个随机订单</button>
            </div>

            <label for="intervalInput">更新间隔（毫秒）</label>
            <input id="intervalInput" type="number" min="500" step="100" value="2000">

            <div id="summary">等待加载地图...</div>
            <pre id="output"></pre>
        </aside>
    </div>

    <script>
        const API_BASE = location.origin && location.origin !== "null" && location.origin.startsWith("http")
            ? location.origin
            : "http://127.0.0.1:5000";

        const canvas = document.getElementById("mapCanvas");
        const ctx = canvas.getContext("2d");
        const fleetInfo = document.getElementById("fleetInfo");
        const poiSelect = document.getElementById("poiSelect");
        const lonInput = document.getElementById("lonInput");
        const latInput = document.getElementById("latInput");
        const intervalInput = document.getElementById("intervalInput");
        const realtimeBtn = document.getElementById("realtimeBtn");
        const summary = document.getElementById("summary");
        const output = document.getElementById("output");

        let roadNetwork = null;
        let fleetList = [];
        let latestPaths = new Map();
        let vehicleColors = new Map();
        let simulatedGps = new Map();
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let didDrag = false;
        let dragStart = { x: 0, y: 0 };
        let pointerStart = { x: 0, y: 0 };
        let realtimeTimer = null;
        let poiList = [];

        /**
         * 调用后端 JSON API，并统一处理非 2xx 错误。
         * @param {string} path API 路径，例如 "/fleet"。
         * @param {RequestInit} options fetch 配置。
         * @returns {Promise<object>} 后端返回的 JSON 对象。
         */
        async function requestJson(path, options = {}) {
            const resp = await fetch(`${API_BASE}${path}`, {
                headers: { "Content-Type": "application/json" },
                ...options
            });
            const text = await resp.text();
            let data;
            try {
                data = text ? JSON.parse(text) : {};
            } catch {
                throw new Error(`${path} 返回的不是 JSON：${text.slice(0, 200)}`);
            }
            if (!resp.ok) {
                throw new Error(data.error || `${path} 请求失败，HTTP ${resp.status}`);
            }
            return data;
        }

        /**
         * 按设备像素比调整画布尺寸，并重新适配地图视野。
         * @returns {void}
         */
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.max(1, Math.floor(rect.width * dpr));
            canvas.height = Math.max(1, Math.floor(rect.height * dpr));
            fitMapToCanvas();
            drawMap();
        }

        /**
         * 根据路网边界计算初始缩放和平移量。
         * @returns {void}
         */
        function fitMapToCanvas() {
            if (!roadNetwork) return;
            const b = roadNetwork.bounds;
            const width = b.max_lon - b.min_lon;
            const height = b.max_lat - b.min_lat;
            const sx = canvas.width / width;
            const sy = canvas.height / height;
            scale = Math.min(sx, sy) * 0.88;
            offsetX = (canvas.width - width * scale) / 2 - b.min_lon * scale;
            offsetY = (canvas.height + height * scale) / 2 + b.min_lat * scale;
        }

        /**
         * 将经纬度坐标转换为 Canvas 像素坐标。
         * @param {number} lon 经度。
         * @param {number} lat 纬度。
         * @returns {{x: number, y: number}} 屏幕坐标。
         */
        function worldToScreen(lon, lat) {
            return {
                x: lon * scale + offsetX,
                y: -lat * scale + offsetY
            };
        }

        /**
         * 将 Canvas 像素坐标反算为经纬度坐标。
         * @param {number} x Canvas X 坐标。
         * @param {number} y Canvas Y 坐标。
         * @returns {{lon: number, lat: number}} 经纬度坐标。
         */
        function screenToWorld(x, y) {
            return {
                lon: (x - offsetX) / scale,
                lat: -(y - offsetY) / scale
            };
        }

        /**
         * 绘制基础路网、POI 和最新车辆路径。
         * @returns {void}
         */
        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            if (!roadNetwork) return;

            ctx.save();
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            ctx.strokeStyle = "rgba(148, 163, 184, 0.55)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (const edge of roadNetwork.edges) {
                const u = roadNetwork.nodes[edge.u];
                const v = roadNetwork.nodes[edge.v];
                if (!u || !v) continue;
                const a = worldToScreen(u.lon, u.lat);
                const b = worldToScreen(v.lon, v.lat);
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
            }
            ctx.stroke();

            ctx.fillStyle = "#f8fafc";
            for (const poiId of roadNetwork.pois) {
                const poi = roadNetwork.nodes[poiId];
                if (!poi) continue;
                const p = worldToScreen(poi.lon, poi.lat);
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            for (const item of latestPaths.values()) {
                drawUpdatedPath(item.data, item.color);
            }
            ctx.restore();
        }

        /**
         * 绘制后端返回的车辆轨迹、吸附点和接送目标点。
         * @param {object} data /fleet/<vehicle_id>/path 返回的数据。
         * @param {string} color 车辆轨迹颜色。
         * @returns {void}
         */
        function getRoutePoints(data) {
            return data?.route?.points || data?.planned_route_point || data?.path || [];
        }

        function getRouteSegments(data) {
            return data?.route?.segments || data?.segments || [];
        }

        function getSnapPoint(data) {
            if (data?.snap?.point) {
                return {
                    ...data.snap.point,
                    distance_to_gps: data.snap.distance_to_gps
                };
            }
            return data?.snapped_point || data?.snapped_node || null;
        }

        function getPathEvents(data) {
            return data?.events || data?.changed_steps || [];
        }

        function getPathVehicleId(data) {
            return data?.vehicle?.id || data?.vehicle_id || "-";
        }

        function drawUpdatedPath(data, color = "#22c55e") {
            const path = getRoutePoints(data);
            if (path.length > 0) {
                ctx.strokeStyle = color;
                ctx.lineWidth = 4;
                ctx.beginPath();
                path.forEach((node, index) => {
                    const p = worldToScreen(node.lon, node.lat);
                    if (index === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                });
                ctx.stroke();
            }

            const snappedPoint = getSnapPoint(data);
            if (snappedPoint) {
                const p = worldToScreen(snappedPoint.lon, snappedPoint.lat);
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            for (const segment of getRouteSegments(data)) {
                const t = segment.target || segment.target_node;
                if (!t) continue;
                const p = worldToScreen(t.lon, t.lat);
                ctx.fillStyle = segment.type === "O" ? "#38bdf8" : "#f97316";
                ctx.beginPath();
                ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#ffffff";
                ctx.font = "12px Arial";
                ctx.fillText(`${segment.type}${segment.request_id}`, p.x + 8, p.y - 8);
            }
        }

        /**
         * 将全部车辆路径更新结果写入摘要面板，并触发地图重绘。
         * @param {Array<object>} results 每辆车的路径更新结果。
         * @returns {void}
         */
        function showBatchResults(results) {
            const successList = results.filter(item => item.ok);
            const failList = results.filter(item => !item.ok);
            const lines = [
                `本次更新车辆：${successList.length}/${results.length}`,
                `失败车辆：${failList.length}`,
                `更新时间：${new Date().toLocaleTimeString()}`
            ];

            for (const item of successList) {
                const data = item.data;
                const snappedPoint = getSnapPoint(data);
                const changedSteps = getPathEvents(data).map(step => {
                    const action = step.action === "pickup" ? "接客" : "送客";
                    return `${action}${step.request_id}`;
                }).join("，") || "无";
                const plannedStepCount = data.route?.planned_step_count ?? data.planned_route_size ?? 0;
                lines.push(
                    `${getPathVehicleId(data)}：任务 ${plannedStepCount}，轨迹点 ${getRoutePoints(data).length}，上下客 ${changedSteps}`
                );
                if (item.gps) {
                    lines.push(`  本轮 GPS：${item.gps.lon.toFixed(6)}, ${item.gps.lat.toFixed(6)}`);
                }
                if (item.next_gps) {
                    lines.push(`  模拟下一点：${item.next_gps.lon.toFixed(6)}, ${item.next_gps.lat.toFixed(6)}`);
                }
                if (snappedPoint) {
                    lines.push(`  吸附点：${snappedPoint.name || snappedPoint.id || "-"}，偏差 ${Number(snappedPoint.distance_to_gps || 0).toFixed(2)} 米`);
                }
            }

            for (const item of failList) {
                lines.push(`${item.vehicle_id}：${item.error}`);
            }

            summary.textContent = lines.join("\n");
            output.textContent = JSON.stringify(results, null, 2);
            drawMap();
        }

        /**
         * 计算两个经纬度点之间的球面距离。
         * @param {{lon: number, lat: number}} a 起点。
         * @param {{lon: number, lat: number}} b 终点。
         * @returns {number} 两点距离，单位米。
         */
        function distanceMeters(a, b) {
            const r = 6371000;
            const lat1 = a.lat * Math.PI / 180;
            const lat2 = b.lat * Math.PI / 180;
            const dLat = (b.lat - a.lat) * Math.PI / 180;
            const dLon = (b.lon - a.lon) * Math.PI / 180;
            const h = Math.sin(dLat / 2) ** 2
                + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
            return 2 * r * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
        }

        /**
         * 按比例在线段上插值。
         * @param {{lon: number, lat: number}} a 起点。
         * @param {{lon: number, lat: number}} b 终点。
         * @param {number} ratio 插值比例，范围 0~1。
         * @returns {{lon: number, lat: number}} 插值后的经纬度。
         */
        function interpolatePoint(a, b, ratio) {
            return {
                lon: a.lon + (b.lon - a.lon) * ratio,
                lat: a.lat + (b.lat - a.lat) * ratio
            };
        }

        /**
         * 沿后端返回轨迹推进一个很小的距离，生成下一次模拟 GPS。
         * @param {object} data 路径更新接口返回体。
         * @returns {{lon: number, lat: number}|null} 下一次模拟 GPS。
         */
        function advanceGpsForNextRequest(data) {
            const points = getRoutePoints(data)
                .filter(point => Number.isFinite(Number(point.lon)) && Number.isFinite(Number(point.lat)));
            if (points.length < 2) return null;

            const snappedPoint = getSnapPoint(data) || points[0];
            let current = { lon: Number(snappedPoint.lon), lat: Number(snappedPoint.lat) };
            let remainingDistance = 5;
            let nextPoint = null;

            for (const point of points) {
                const target = { lon: Number(point.lon), lat: Number(point.lat) };
                const segmentDistance = distanceMeters(current, target);
                if (segmentDistance < 0.1) {
                    current = target;
                    continue;
                }
                if (segmentDistance >= remainingDistance) {
                    nextPoint = interpolatePoint(current, target, remainingDistance / segmentDistance);
                    break;
                }
                remainingDistance -= segmentDistance;
                current = target;
            }

            return nextPoint;
        }

        /**
         * 调用后端初始化接口，并显示初始化结果。
         * @returns {Promise<void>}
         */
        async function initSystem() {
            summary.textContent = "正在初始化系统...";
            const data = await requestJson("/init", {
                method: "POST",
                body: JSON.stringify({})
            });
            simulatedGps.clear();
            summary.textContent = `初始化结果：${data.status}`;
            output.textContent = JSON.stringify(data, null, 2);
        }

        /**
         * 加载路网、车队和 POI 数据，并刷新页面控件。
         * @returns {Promise<void>}
         */
        async function loadAll() {
            summary.textContent = "正在加载路网、车辆和 POI...";
            const mapData = await requestJson("/map/road-network");
            const fleetData = await requestJson("/fleet");
            const poiData = await requestJson("/pois");

            roadNetwork = mapData;
            updateFleetState(fleetData.fleet || []);
            fillPois(poiData.pois || []);
            fitMapToCanvas();
            drawMap();
            summary.textContent = `已加载 ${Object.keys(mapData.nodes || {}).length} 个路网点，${mapData.edges.length} 条边，${fleetList.length} 辆车。`;
        }

        /**
         * 刷新车队状态并更新侧边栏车辆概览。
         * @param {Array<object>} fleet /fleet 接口返回的车辆列表。
         * @returns {void}
         */
        function updateFleetState(fleet) {
            fleetList = fleet;
            vehicleColors.clear();
            const lines = [];
            for (const vehicle of fleet) {
                vehicleColors.set(vehicle.id, vehicle.color || "#22c55e");
                const routeSize = (vehicle.planned_route || []).length;
                lines.push(`${vehicle.id}：${routeSize} 个计划任务，车上 ${vehicle.on_board_count || 0} 人`);
            }
            fleetInfo.textContent = lines.length ? lines.join("\n") : "未加载车辆。";
        }

        /**
         * 将 POI 列表写入下拉框，并默认填入第一个 POI 坐标。
         * @param {Array<object>} pois /pois 接口返回的 POI 列表。
         * @returns {void}
         */
        function fillPois(pois) {
            poiList = pois;
            poiSelect.innerHTML = "";
            for (const poi of pois) {
                const option = document.createElement("option");
                option.value = `${poi.lon},${poi.lat}`;
                option.textContent = `${poi.name} (${poi.lon.toFixed(6)}, ${poi.lat.toFixed(6)})`;
                poiSelect.appendChild(option);
            }
            if (poiSelect.options.length > 0) {
                fillPoiCoords();
            }
        }

        /**
         * 将当前选中的 POI 坐标填入 GPS 输入框。
         * @returns {void}
         */
        function fillPoiCoords() {
            const [lon, lat] = poiSelect.value.split(",");
            lonInput.value = lon;
            latInput.value = lat;
        }

        /**
         * 将 Date 格式化为后端订单接口要求的 YYYY-MM-DD HH:MM:SS。
         * @param {Date} date 时间对象。
         * @returns {string} 本地时间字符串。
         */
        function formatDateTime(date) {
            const pad = value => String(value).padStart(2, "0");
            return [
                date.getFullYear(),
                pad(date.getMonth() + 1),
                pad(date.getDate())
            ].join("-") + " " + [
                pad(date.getHours()),
                pad(date.getMinutes()),
                pad(date.getSeconds())
            ].join(":");
        }

        /**
         * 确保本地已经缓存 POI 列表。
         * @returns {Promise<boolean>} POI 数量足够时返回 true。
         */
        async function ensurePoisLoaded() {
            if (poiList.length < 2) {
                const poiData = await requestJson("/pois");
                poiList = poiData.pois || [];
            }
            if (poiList.length < 2) {
                summary.textContent = "POI 数量不足，无法创建随机订单。";
                return false;
            }
            return true;
        }

        /**
         * 随机选取一组不同的 OD POI。
         * @returns {{origin: object, destination: object}} 随机 OD。
         */
        function pickRandomOd() {
            const originIndex = Math.floor(Math.random() * poiList.length);
            let destinationIndex = Math.floor(Math.random() * poiList.length);
            while (destinationIndex === originIndex) {
                destinationIndex = Math.floor(Math.random() * poiList.length);
            }
            return {
                origin: poiList[originIndex],
                destination: poiList[destinationIndex]
            };
        }

        /**
         * 创建一条随机订单。
         * @param {number} index 批量创建时的序号。
         * @returns {Promise<object>} 后端订单创建结果。
         */
        async function createRandomOrder(index = 0) {
            const { origin, destination } = pickRandomOd();
            const now = new Date();
            const earliest = new Date(now.getTime() + 5 * 60 * 1000);
            const latest = new Date(now.getTime() + 20 * 60 * 1000);
            return requestJson("/order", {
                method: "POST",
                body: JSON.stringify({
                    request_id: `REQ-${Date.now()}-${index}-${Math.floor(Math.random() * 100000)}`,
                    origin: {
                        lon: origin.lon,
                        lat: origin.lat
                    },
                    destination: {
                        lon: destination.lon,
                        lat: destination.lat
                    },
                    expected_pickup_time: {
                        earliest: formatDateTime(earliest),
                        latest: formatDateTime(latest)
                    },
                    passenger_count: 1
                })
            });
        }

        /**
         * 批量创建随机订单。
         * @param {number} count 创建数量。
         * @returns {Promise<void>}
         */
        async function createRandomOrders(count) {
            if (!await ensurePoisLoaded()) {
                return;
            }

            const orders = [];
            summary.textContent = `正在创建 ${count} 个随机订单...`;
            for (let i = 0; i < count; i++) {
                orders.push(await createRandomOrder(i + 1));
                if ((i + 1) % 10 === 0 || i + 1 === count) {
                    summary.textContent = `已创建 ${i + 1}/${count} 个随机订单，后台匹配线程会自动调度。`;
                }
            }

            const fleetData = await requestJson("/fleet");
            simulatedGps.clear();
            updateFleetState(fleetData.fleet || []);
            summary.textContent = `已创建 ${orders.length} 个随机订单。后台调度完成后，点击“更新全部车辆路径”或开启实时更新。`;
            output.textContent = JSON.stringify(orders, null, 2);
        }

        /**
         * 从手动输入框读取备用 GPS。
         * @returns {{lon: number, lat: number}|null} 合法 GPS 或 null。
         */
        function readFallbackGpsFromInputs() {
            const lon = Number(lonInput.value);
            const lat = Number(latInput.value);
            if (!Number.isFinite(lon) || !Number.isFinite(lat)) {
                return null;
            }
            return { lon, lat };
        }

        /**
         * 获取某辆车下一次路径更新使用的 GPS。
         * @param {object} vehicle 车辆快照。
         * @returns {{lon: number, lat: number}|null} GPS 坐标。
         */
        function getVehicleGpsForRequest(vehicle) {
            const simulated = simulatedGps.get(vehicle.id);
            if (simulated) {
                return simulated;
            }

            const gps = vehicle.gps || {};
            if (Number.isFinite(Number(gps.lon)) && Number.isFinite(Number(gps.lat))) {
                return { lon: Number(gps.lon), lat: Number(gps.lat) };
            }
            return readFallbackGpsFromInputs();
        }

        /**
         * 使用每辆车当前 GPS 更新全部车辆路径。
         * @returns {Promise<Array<object>>} 每辆车的路径更新结果。
         */
        async function submitPathUpdate() {
            const fleetData = await requestJson("/fleet");
            updateFleetState(fleetData.fleet || []);
            if (fleetList.length === 0) {
                summary.textContent = "当前没有可更新的车辆。";
                return [];
            }

            const results = [];
            for (const vehicle of fleetList) {
                const gps = getVehicleGpsForRequest(vehicle);
                if (!gps) {
                    results.push({
                        ok: false,
                        vehicle_id: vehicle.id,
                        error: "没有可用 GPS，无法更新路径。"
                    });
                    continue;
                }

                try {
                    const data = await requestJson(`/fleet/${encodeURIComponent(vehicle.id)}/path`, {
                        method: "POST",
                        body: JSON.stringify(gps)
                    });
                    const color = vehicle.color || vehicleColors.get(vehicle.id) || "#22c55e";
                    latestPaths.set(vehicle.id, { data, color });
                    const nextGps = advanceGpsForNextRequest(data);
                    if (nextGps) {
                        simulatedGps.set(vehicle.id, nextGps);
                    } else {
                        simulatedGps.delete(vehicle.id);
                    }
                    results.push({ ok: true, vehicle_id: vehicle.id, gps, next_gps: nextGps, data });
                } catch (err) {
                    results.push({
                        ok: false,
                        vehicle_id: vehicle.id,
                        error: err.message
                    });
                }
            }

            showBatchResults(results);
            return results;
        }

        /**
         * 开启或停止定时路径更新。
         * @returns {void}
         */
        function toggleRealtime() {
            if (realtimeTimer) {
                clearInterval(realtimeTimer);
                realtimeTimer = null;
                realtimeBtn.textContent = "开始实时更新";
                summary.textContent += "\n实时更新已停止。";
                return;
            }

            const interval = Math.max(500, Number(intervalInput.value) || 2000);
            realtimeBtn.textContent = "停止实时更新";
            submitPathUpdate().catch(err => summary.textContent = err.message);
            realtimeTimer = setInterval(() => {
                submitPathUpdate().catch(err => summary.textContent = err.message);
            }, interval);
        }

        canvas.addEventListener("mousedown", event => {
            isDragging = true;
            didDrag = false;
            const dpr = window.devicePixelRatio || 1;
            pointerStart = { x: event.clientX * dpr, y: event.clientY * dpr };
            dragStart = {
                x: pointerStart.x - offsetX,
                y: pointerStart.y - offsetY
            };
        });

        canvas.addEventListener("mousemove", event => {
            if (!isDragging) return;
            const dpr = window.devicePixelRatio || 1;
            const x = event.clientX * dpr;
            const y = event.clientY * dpr;
            if (Math.hypot(x - pointerStart.x, y - pointerStart.y) > 4) {
                didDrag = true;
            }
            offsetX = x - dragStart.x;
            offsetY = y - dragStart.y;
            drawMap();
        });

        canvas.addEventListener("mouseup", event => {
            if (!isDragging) return;
            isDragging = false;
            if (didDrag) return;
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const x = (event.clientX - rect.left) * dpr;
            const y = (event.clientY - rect.top) * dpr;
            const pos = screenToWorld(x, y);
            lonInput.value = pos.lon.toFixed(6);
            latInput.value = pos.lat.toFixed(6);
        });
        canvas.addEventListener("mouseleave", () => { isDragging = false; });

        canvas.addEventListener("wheel", event => {
            event.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const x = (event.clientX - rect.left) * dpr;
            const y = (event.clientY - rect.top) * dpr;
            const before = screenToWorld(x, y);
            const factor = event.deltaY < 0 ? 1.15 : 0.87;
            scale *= factor;
            const after = worldToScreen(before.lon, before.lat);
            offsetX += x - after.x;
            offsetY += y - after.y;
            drawMap();
        }, { passive: false });

        document.getElementById("initBtn").addEventListener("click", () => {
            initSystem().then(loadAll).catch(err => summary.textContent = err.message);
        });
        document.getElementById("loadBtn").addEventListener("click", () => {
            loadAll().catch(err => summary.textContent = `${err.message}\n如果系统未初始化，请先点击“初始化系统”。`);
        });
        document.getElementById("submitBtn").addEventListener("click", () => {
            submitPathUpdate().catch(err => summary.textContent = err.message);
        });
        document.getElementById("createOrderBtn").addEventListener("click", () => {
            createRandomOrders(1).catch(err => summary.textContent = err.message);
        });
        document.getElementById("create10OrdersBtn").addEventListener("click", () => {
            createRandomOrders(10).catch(err => summary.textContent = err.message);
        });
        document.getElementById("create50OrdersBtn").addEventListener("click", () => {
            createRandomOrders(50).catch(err => summary.textContent = err.message);
        });
        realtimeBtn.addEventListener("click", toggleRealtime);
        poiSelect.addEventListener("change", fillPoiCoords);
        window.addEventListener("resize", resizeCanvas);

        resizeCanvas();
        loadAll().catch(err => {
            summary.textContent = `${err.message}\n如果系统未初始化，请先点击“初始化系统”。`;
        });
    </script>
</body>
